target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv*",
  "node_modules",
  "dashboard/build",
  "dashboard/dist",
  "live_chat_archive",
  "mobile",
  "linasbot_data",
  "data",
  "scripts/debug_resume_probe.py",
]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # formatter owns line length
  "B008",  # FastAPI Depends() in defaults is idiomatic
]

# No per-file ignore lists — fix findings in source.
