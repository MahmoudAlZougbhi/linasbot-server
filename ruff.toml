target-version = "py311"
line-length = 120
exclude = [
  ".venv*",
  "node_modules",
  "dashboard/build",
  "frontend",
  "live_chat_archive",
  "mobile",
  "linasbot_data",
  "data",
]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled by formatter preference
  "B008",  # FastAPI Depends in defaults
]

[lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
"handlers/*" = ["E402", "F401", "F841"]
"modules/*" = ["E402"]
