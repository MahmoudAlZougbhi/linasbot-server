# Isolated Postgres + Redis for omnichannel certification. Never production hosts.

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnichannel-cert-postgres
    environment:
      POSTGRES_USER: omnicert
      POSTGRES_PASSWORD: omnicert
      POSTGRES_DB: omnicert
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicert -d omnicert"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - omnichannel_cert

  redis:
    image: redis:7-alpine
    container_name: omnichannel-cert-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - omnichannel_cert

networks:
  omnichannel_cert:
    driver: bridge
