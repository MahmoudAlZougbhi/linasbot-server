# Production deploy runs ONLY after Quality Gates succeed on main.
#
# Normal path: push to main -> Quality Gates -> this workflow (workflow_run, success required).
#
# Emergency bypass (skip gate verification): Actions -> Deploy to Production -> Run workflow
# with workflow_dispatch and set:
#   EMERGENCY_DEPLOY_CONFIRM = I_UNDERSTAND_SKIPPING_GATES
# Use only when gates are broken but production must be patched; document incident + follow-up
# to restore green Quality Gates before the next routine deploy.

name: Deploy to Production

on:
  workflow_run:
    workflows: ["Quality Gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      EMERGENCY_DEPLOY_CONFIRM:
        description: "Type I_UNDERSTAND_SKIPPING_GATES to bypass quality gate requirement"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.EMERGENCY_DEPLOY_CONFIRM == 'I_UNDERSTAND_SKIPPING_GATES')

    steps:
      - name: Gate source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Deploy authorized by successful Quality Gates on main."
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "::warning::EMERGENCY DEPLOY — quality gates were NOT verified for this run."
            echo "Confirmation input matched I_UNDERSTAND_SKIPPING_GATES."
          fi

      - name: Start deployment
        run: |
          echo "Starting deployment..."
          echo "Repository: $GITHUB_REPOSITORY"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "Branch: main"
            echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          else
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: $GITHUB_SHA"
          fi

      - name: Deploy on production server (node01)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "[deploy] Connected to $(hostname)"
            cd /opt/linasbot

            # Backup entire data/ before git reset (Q&A, knowledge, style, price, content files, settings)
            umask 077
            DATA_BACKUP="/tmp/linasbot_data_backup_$$"
            if [ -d data ]; then
              echo "[deploy] Backing up data/ (knowledge, style, Q&A, settings, content files...)"
              cp -a data "$DATA_BACKUP"
              chmod 700 "$DATA_BACKUP"
            fi

            git fetch origin main
            git reset --hard origin/main

            # Restore user data so dashboard saves persist across deploys
            if [ -d "$DATA_BACKUP" ]; then
              echo "[deploy] Restoring user data..."
              mkdir -p data
              cp -a "$DATA_BACKUP"/* data/ 2>/dev/null || true
              rm -rf "$DATA_BACKUP"
              echo "[deploy] User data restored."
            fi

            sudo bash /opt/linasbot/deploy.sh
            echo "[deploy] Deployment completed successfully on $(hostname)"

      - name: Deploy on production server (node02)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 167.99.89.243
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            echo "[deploy] Connected to $(hostname)"
            cd /opt/linasbot

            umask 077
            DATA_BACKUP="/tmp/linasbot_data_backup_$$"
            if [ -d data ]; then
              echo "[deploy] Backing up data/ (knowledge, style, Q&A, settings, content files...)"
              cp -a data "$DATA_BACKUP"
              chmod 700 "$DATA_BACKUP"
            fi

            git fetch origin main
            git reset --hard origin/main

            if [ -d "$DATA_BACKUP" ]; then
              echo "[deploy] Restoring user data..."
              mkdir -p data
              cp -a "$DATA_BACKUP"/* data/ 2>/dev/null || true
              rm -rf "$DATA_BACKUP"
              echo "[deploy] User data restored."
            fi

            sudo bash /opt/linasbot/deploy.sh
            echo "[deploy] Deployment completed successfully on $(hostname)"
