              "release_manifest_size": (bundle / "release-manifest.json").stat().st_size,
              "manifest_target_tree_sha": source["target_tree_sha"],
              "expected_helper_sha": sha256_file(helper),
              "expected_helper_size": helper.stat().st_size,
