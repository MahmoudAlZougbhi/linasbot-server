            archive = bundle / "control-plane.tar"
            archive_raw = read_secure(archive, 0o600, 64 << 20)
            if hashlib.sha256(archive_raw).hexdigest() != control["archive_sha256"]:
                raise SystemExit("protected control-plane archive changed")
            helper_name = "scripts/ha/deploy_meta_release_ha.sh"
            with tarfile.open(archive, mode="r:") as handle:
