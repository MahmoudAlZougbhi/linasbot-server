# Manual-only, exact-artifact two-node production release transaction.
# New deploys stop with both nodes drained at exact target parity. A separate
# commit_exact dispatch must supply a distinct fresh provider observation before
# the durable commit decision and admission.

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      DEPLOY_OPERATION:
        description: "Exact transaction operation"
        required: true
        type: choice
        options:
          - steady
          - reconcile_exact
          - commit_exact
          - recover_exact
          - retry_reconcile_exact
      TARGET_SHA:
        description: "Exact tested 40-character release SHA"
        required: true
        type: string
      QUALITY_GATES_RUN_ID:
        description: "Exact successful Quality Gates run ID"
        required: true
        type: string
      RELEASE_RUN_ATTEMPT:
        description: "Exact Quality Gates run attempt"
        required: true
        type: string
      RELEASE_ARTIFACT_ID:
        description: "Exact immutable linasbot-release-TARGET_SHA artifact ID"
        required: true
        type: string
      RELEASE_ARTIFACT_API_SHA256:
        description: "Bare 64hex digest from the GitHub artifact REST object"
        required: true
        type: string
      RELEASE_MANIFEST_SHA256:
        description: "Exact release-manifest.json SHA-256"
        required: true
        type: string
      RELEASE_TARGET_TREE_SHA:
        description: "Exact target Git tree SHA bound by source.bundle"
        required: true
        type: string
      RELEASE_INSTALL_CONFIRM:
        description: "New deploy only: exact artifact/control/source/tree installation confirmation"
        required: false
        type: string
      NODE01_BASELINE_SHA:
        description: "Exact authorized node01 baseline SHA"
        required: true
        type: string
      NODE02_BASELINE_SHA:
        description: "Exact authorized node02 baseline SHA"
        required: true
        type: string
      BOOTSTRAP_PLAN_SHA256:
        description: "New deploy: exact committed first-transition bootstrap plan SHA-256"
        required: false
        type: string
      RECONCILE_CONFIRM:
        description: "Reconcile only: I_UNDERSTAND_RECONCILING_DISTINCT_HA_BASELINES"
        required: false
        type: string
      DEPLOY_CONFIRM:
        description: "New deploy only: exact target and initial LB artifact confirmation"
        required: false
        type: string
      RECOVERY_JOURNAL_SHA256:
        description: "Commit/recover/retry only: exact durable deploy.active digest"
        required: false
        type: string
      COMMIT_CONFIRM:
        description: "Commit only: exact journal and fresh LB artifact confirmation"
        required: false
        type: string
      RECOVERY_CONFIRM:
        description: "Recovery only: exact journal, LB artifact, and decision confirmation"
        required: false
        type: string
      RETRY_RECONCILE_CONFIRM:
        description: "Retry only: exact journal and LB artifact confirmation"
        required: false
        type: string
      LB_ATTESTATION_BASE64:
        description: "Canonical fresh provider attestation encoded as strict base64"
        required: true
        type: string
      LB_ATTESTATION_SHA256:
        description: "Exact canonical LB attestation artifact SHA-256"
        required: true
        type: string
      LB_READY_PROJECTION_SHA256:
        description: "Exact reviewed full /api/ready projection SHA-256"
        required: true
        type: string
      LB_INSTALL_CONFIRM:
        description: "Exact operation/journal/LB installation confirmation"
        required: true
        type: string
      LB_OWNER_CONFIRM:
        description: "I_HOLD_EXCLUSIVE_DO_LB_OWNER_UNTIL_DEPLOY_COMPLETE"
        required: true
        type: string
      PROTECTION_CONFIRM:
        description: "I_CONFIRMED_META_SOCIAL_CUTOVER_HAS_REQUIRED_REVIEWERS"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Exact Artifact HA Transaction
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: meta-social-cutover
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    steps:
      - name: Gate protected operation and immutable GitHub authorities
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OPERATION: ${{ inputs.DEPLOY_OPERATION }}
          TARGET_SHA: ${{ inputs.TARGET_SHA }}
          QUALITY_GATES_RUN_ID: ${{ inputs.QUALITY_GATES_RUN_ID }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.RELEASE_RUN_ATTEMPT }}
          RELEASE_ARTIFACT_ID: ${{ inputs.RELEASE_ARTIFACT_ID }}
          RELEASE_ARTIFACT_API_SHA256: ${{ inputs.RELEASE_ARTIFACT_API_SHA256 }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.RELEASE_MANIFEST_SHA256 }}
          RELEASE_TARGET_TREE_SHA: ${{ inputs.RELEASE_TARGET_TREE_SHA }}
          NODE01_BASELINE_SHA: ${{ inputs.NODE01_BASELINE_SHA }}
          NODE02_BASELINE_SHA: ${{ inputs.NODE02_BASELINE_SHA }}
          BOOTSTRAP_PLAN_SHA256: ${{ inputs.BOOTSTRAP_PLAN_SHA256 }}
          RECONCILE_CONFIRM: ${{ inputs.RECONCILE_CONFIRM }}
          DEPLOY_CONFIRM: ${{ inputs.DEPLOY_CONFIRM }}
          RECOVERY_JOURNAL_SHA256: ${{ inputs.RECOVERY_JOURNAL_SHA256 }}
          COMMIT_CONFIRM: ${{ inputs.COMMIT_CONFIRM }}
          RECOVERY_CONFIRM: ${{ inputs.RECOVERY_CONFIRM }}
          RETRY_RECONCILE_CONFIRM: ${{ inputs.RETRY_RECONCILE_CONFIRM }}
          LB_ATTESTATION_SHA256: ${{ inputs.LB_ATTESTATION_SHA256 }}
          LB_READY_PROJECTION_SHA256: ${{ inputs.LB_READY_PROJECTION_SHA256 }}
          LB_INSTALL_CONFIRM: ${{ inputs.LB_INSTALL_CONFIRM }}
          LB_OWNER_CONFIRM: ${{ inputs.LB_OWNER_CONFIRM }}
          PROTECTION_CONFIRM: ${{ inputs.PROTECTION_CONFIRM }}
          META_HA_PROTECTED_ENVIRONMENT_APPROVED: ${{ vars.META_HA_PROTECTED_ENVIRONMENT_APPROVED }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NODE01_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NODE02_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$QUALITY_GATES_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_ARTIFACT_API_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_TARGET_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LB_ATTESTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$LB_READY_PROJECTION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [ "$LB_ATTESTATION_SHA256" != "$(printf '%064d' 0)" ]
          [ "$LB_READY_PROJECTION_SHA256" != "$(printf '%064d' 0)" ]
          [ "$LB_OWNER_CONFIRM" = "I_HOLD_EXCLUSIVE_DO_LB_OWNER_UNTIL_DEPLOY_COMPLETE" ]
          [ "$PROTECTION_CONFIRM" = "I_CONFIRMED_META_SOCIAL_CUTOVER_HAS_REQUIRED_REVIEWERS" ]
          [ "$META_HA_PROTECTED_ENVIRONMENT_APPROVED" = true ]

          REQUIRED_REVIEWER_COUNT="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/meta-social-cutover" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length')"
          PREVENT_SELF_REVIEW="$(gh api \
            "repos/$GITHUB_REPOSITORY/environments/meta-social-cutover" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .prevent_self_review] | all')"
          [[ "$REQUIRED_REVIEWER_COUNT" =~ ^[1-9][0-9]*$ ]]
          [ "$PREVENT_SELF_REVIEW" = false ]

          TARGET_PREFIX="${TARGET_SHA:0:16}"
          LB_PREFIX="${LB_ATTESTATION_SHA256:0:16}"
          PROJECTION_PREFIX="${LB_READY_PROJECTION_SHA256:0:16}"
          if [ "$DEPLOY_OPERATION" = steady ]; then
            [ "$TARGET_SHA" = "$DISPATCH_SHA" ]
            [ "$NODE01_BASELINE_SHA" = "$NODE02_BASELINE_SHA" ]
            [[ "$BOOTSTRAP_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [ -z "$RECONCILE_CONFIRM$RECOVERY_JOURNAL_SHA256" ]
            [ -z "$COMMIT_CONFIRM$RECOVERY_CONFIRM$RETRY_RECONCILE_CONFIRM" ]
            [ "$DEPLOY_CONFIRM" = "DEPLOY_${TARGET_SHA}_LB_${LB_PREFIX}_WITH_HA_PREFLIGHT_BACKUPS_AND_ROLLBACK" ]
            [ "$LB_INSTALL_CONFIRM" = "INSTALL_DEPLOY_LB_${TARGET_PREFIX^^}_${LB_PREFIX^^}_${PROJECTION_PREFIX^^}" ]
          elif [ "$DEPLOY_OPERATION" = reconcile_exact ]; then
            [ "$TARGET_SHA" = "$DISPATCH_SHA" ]
            [ "$NODE01_BASELINE_SHA" != "$NODE02_BASELINE_SHA" ]
            [[ "$BOOTSTRAP_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [ "$RECONCILE_CONFIRM" = "I_UNDERSTAND_RECONCILING_DISTINCT_HA_BASELINES" ]
            [ -z "$RECOVERY_JOURNAL_SHA256$COMMIT_CONFIRM$RECOVERY_CONFIRM$RETRY_RECONCILE_CONFIRM" ]
            [ "$DEPLOY_CONFIRM" = "DEPLOY_${TARGET_SHA}_LB_${LB_PREFIX}_WITH_HA_PREFLIGHT_BACKUPS_AND_ROLLBACK" ]
            [ "$LB_INSTALL_CONFIRM" = "INSTALL_DEPLOY_LB_${TARGET_PREFIX^^}_${LB_PREFIX^^}_${PROJECTION_PREFIX^^}" ]
          elif [ "$DEPLOY_OPERATION" = commit_exact ]; then
            [[ "$RECOVERY_JOURNAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
            JOURNAL_PREFIX="${RECOVERY_JOURNAL_SHA256:0:16}"
            [ -z "$BOOTSTRAP_PLAN_SHA256$RECONCILE_CONFIRM$DEPLOY_CONFIRM" ]
            [ -z "$RECOVERY_CONFIRM$RETRY_RECONCILE_CONFIRM" ]
            [ "$COMMIT_CONFIRM" = "COMMIT_DEPLOY_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_LB_${LB_PREFIX^^}_FROM_TARGET_PARITY" ]
            [ "$LB_INSTALL_CONFIRM" = "INSTALL_COMMIT_LB_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_${LB_PREFIX^^}_${PROJECTION_PREFIX^^}" ]
          elif [ "$DEPLOY_OPERATION" = recover_exact ]; then
            [[ "$RECOVERY_JOURNAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
            JOURNAL_PREFIX="${RECOVERY_JOURNAL_SHA256:0:16}"
            [ -z "$BOOTSTRAP_PLAN_SHA256$RECONCILE_CONFIRM$DEPLOY_CONFIRM$COMMIT_CONFIRM" ]
            [ -z "$RETRY_RECONCILE_CONFIRM" ]
            RECOVERY_PREFIX="RECOVER_DEPLOY_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_LB_${LB_PREFIX^^}_TO_"
            [ "$RECOVERY_CONFIRM" = "${RECOVERY_PREFIX}ROLLBACK" ] || \
              [ "$RECOVERY_CONFIRM" = "${RECOVERY_PREFIX}COMMIT" ]
            [ "$LB_INSTALL_CONFIRM" = "INSTALL_RECOVER_LB_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_${LB_PREFIX^^}_${PROJECTION_PREFIX^^}" ]
          elif [ "$DEPLOY_OPERATION" = retry_reconcile_exact ]; then
            [[ "$RECOVERY_JOURNAL_SHA256" =~ ^[0-9a-f]{64}$ ]]
            [ "$NODE01_BASELINE_SHA" != "$NODE02_BASELINE_SHA" ]
            JOURNAL_PREFIX="${RECOVERY_JOURNAL_SHA256:0:16}"
            [ -z "$BOOTSTRAP_PLAN_SHA256$RECONCILE_CONFIRM$DEPLOY_CONFIRM$COMMIT_CONFIRM" ]
            [ -z "$RECOVERY_CONFIRM" ]
            [ "$RETRY_RECONCILE_CONFIRM" = "RETRY_DEPLOY_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_LB_${LB_PREFIX^^}_FROM_DISTINCT_DRAINED" ]
            [ "$LB_INSTALL_CONFIRM" = "INSTALL_RETRY_LB_${TARGET_PREFIX^^}_${JOURNAL_PREFIX^^}_${LB_PREFIX^^}_${PROJECTION_PREFIX^^}" ]
          else
            echo "unsupported deployment operation" >&2
            exit 1
          fi

          if [ "$DEPLOY_OPERATION" = steady ] || [ "$DEPLOY_OPERATION" = reconcile_exact ]; then
          RUN_JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALITY_GATES_RUN_ID")"
          RUN_HEAD_SHA="$(jq -r '.head_sha' <<<"$RUN_JSON")"
          RUN_HEAD_BRANCH="$(jq -r '.head_branch' <<<"$RUN_JSON")"
          RUN_CONCLUSION="$(jq -r '.conclusion' <<<"$RUN_JSON")"
          RUN_WORKFLOW_ID="$(jq -r '.workflow_id' <<<"$RUN_JSON")"
          RUN_EVENT="$(jq -r '.event' <<<"$RUN_JSON")"
          RUN_ATTEMPT="$(jq -r '.run_attempt' <<<"$RUN_JSON")"
          EXPECTED_QG_WORKFLOW_ID="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality-gates.yml" --jq '.id')"
          RUN_WORKFLOW_PATH="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$RUN_WORKFLOW_ID" --jq '.path')"
          [ "$RUN_HEAD_SHA" = "$TARGET_SHA" ]
          [ "$RUN_HEAD_BRANCH" = main ]
          [ "$RUN_CONCLUSION" = success ]
          [ "$RUN_WORKFLOW_ID" = "$EXPECTED_QG_WORKFLOW_ID" ]
          [ "$RUN_WORKFLOW_PATH" = .github/workflows/quality-gates.yml ]
          [ "$RUN_EVENT" = push ]
          [ "$RUN_ATTEMPT" = "$RELEASE_RUN_ATTEMPT" ]

          ARTIFACT_JSON="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$RELEASE_ARTIFACT_ID")"
          ARTIFACT_NAME="$(jq -r '.name' <<<"$ARTIFACT_JSON")"
          ARTIFACT_EXPIRED="$(jq -r '.expired' <<<"$ARTIFACT_JSON")"
          ARTIFACT_RUN_ID="$(jq -r '.workflow_run.id' <<<"$ARTIFACT_JSON")"
          ARTIFACT_HEAD_SHA="$(jq -r '.workflow_run.head_sha' <<<"$ARTIFACT_JSON")"
          ARTIFACT_DIGEST="$(jq -r '.digest' <<<"$ARTIFACT_JSON")"
          [ "$ARTIFACT_NAME" = "linasbot-release-$TARGET_SHA" ]
          [ "$ARTIFACT_EXPIRED" = false ]
          [ "$ARTIFACT_RUN_ID" = "$QUALITY_GATES_RUN_ID" ]
          [ "$ARTIFACT_HEAD_SHA" = "$TARGET_SHA" ]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "${ARTIFACT_DIGEST#sha256:}" = "$RELEASE_ARTIFACT_API_SHA256" ]
          fi

      - name: Download exact immutable release artifact ID
        if: inputs.DEPLOY_OPERATION == 'steady' || inputs.DEPLOY_OPERATION == 'reconcile_exact'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ inputs.RELEASE_ARTIFACT_ID }}
          run-id: ${{ inputs.QUALITY_GATES_RUN_ID }}
          github-token: ${{ github.token }}
          path: release-download
          merge-multiple: true

      - name: Validate release bundle and extract exact helper
        id: release_contract
        if: inputs.DEPLOY_OPERATION == 'steady' || inputs.DEPLOY_OPERATION == 'reconcile_exact'
        env:
          TARGET_SHA: ${{ inputs.TARGET_SHA }}
          QUALITY_GATES_RUN_ID: ${{ inputs.QUALITY_GATES_RUN_ID }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.RELEASE_RUN_ATTEMPT }}
          RELEASE_ARTIFACT_ID: ${{ inputs.RELEASE_ARTIFACT_ID }}
          RELEASE_ARTIFACT_API_SHA256: ${{ inputs.RELEASE_ARTIFACT_API_SHA256 }}
          RELEASE_MANIFEST_SHA256: ${{ inputs.RELEASE_MANIFEST_SHA256 }}
          RELEASE_TARGET_TREE_SHA: ${{ inputs.RELEASE_TARGET_TREE_SHA }}
          RELEASE_INSTALL_CONFIRM: ${{ inputs.RELEASE_INSTALL_CONFIRM }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 transfer transfer/release
          mapfile -t CONTRACT_VALUES < <(
            /usr/bin/python3 -B -I -S - \
              "$GITHUB_WORKSPACE/release-download" \
              "$GITHUB_WORKSPACE/transfer/bootstrap-control" \
              "$GITHUB_WORKSPACE/transfer/control" \
              "$TARGET_SHA" "$QUALITY_GATES_RUN_ID" "$RELEASE_RUN_ATTEMPT" \
              "$RELEASE_MANIFEST_SHA256" "$GITHUB_REPOSITORY" <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          (
              bundle_raw,
              bootstrap_raw,
              control_destination_raw,
              target,
              run_id,
              attempt,
              manifest_sha,
              repository,
          ) = sys.argv[1:]
          bundle = Path(bundle_raw)
          bootstrap = Path(bootstrap_raw)
          control_destination = Path(control_destination_raw)
          sha256_re = re.compile(r"[0-9a-f]{64}")


          def unique(pairs: list[tuple[str, object]]) -> dict[str, object]:
              result: dict[str, object] = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("release manifest contains a duplicate JSON key")
                  result[key] = value
              return result


          def read_regular(path: Path, maximum: int) -> bytes:
              before = path.lstat()
              if (
                  not stat.S_ISREG(before.st_mode)
                  or stat.S_ISLNK(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_size > maximum
              ):
                  raise SystemExit("release authority file is unsafe")
              descriptor = os.open(
                  path,
                  os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0),
              )
              try:
                  opened = os.fstat(descriptor)
                  if (opened.st_dev, opened.st_ino, opened.st_size) != (
                      before.st_dev,
                      before.st_ino,
                      before.st_size,
                  ):
                      raise SystemExit("release authority changed while opening")
                  raw = bytearray()
                  while chunk := os.read(descriptor, 1024 * 1024):
                      raw.extend(chunk)
                      if len(raw) > maximum:
                          raise SystemExit("release authority exceeds its size limit")
                  after = os.fstat(descriptor)
                  if (after.st_size, after.st_mtime_ns) != (opened.st_size, opened.st_mtime_ns):
                      raise SystemExit("release authority changed while reading")
              finally:
                  os.close(descriptor)
              return bytes(raw)


          manifest_path = bundle / "release-manifest.json"
          manifest_raw = read_regular(manifest_path, 1024 * 1024)
          if hashlib.sha256(manifest_raw).hexdigest() != manifest_sha:
              raise SystemExit("release manifest differs from dispatch authority")
          try:
              manifest = json.loads(manifest_raw.decode("utf-8", "strict"), object_pairs_hook=unique)
          except (UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit("release manifest is not strict JSON") from exc
          canonical = (
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              + "\n"
          ).encode("utf-8")
          if canonical != manifest_raw:
              raise SystemExit("release manifest is not canonical JSON")
          expected_top = {
              "schema",
              "repository",
              "workflow_path",
              "workflow_ref",
              "run_id",
              "run_attempt",
              "target_sha",
              "source_locks",
              "toolchains",
              "payloads",
          }
          expected_workflow = f"{repository}/.github/workflows/quality-gates.yml@refs/heads/main"
          if (
              not isinstance(manifest, dict)
              or set(manifest) != expected_top
              or manifest.get("schema") != "linasbot-release-manifest-v1"
              or manifest.get("repository") != repository
              or manifest.get("workflow_path") != ".github/workflows/quality-gates.yml"
              or manifest.get("workflow_ref") != expected_workflow
              or manifest.get("run_id") != int(run_id)
              or manifest.get("run_attempt") != int(attempt)
              or manifest.get("target_sha") != target
          ):
              raise SystemExit("release manifest identity differs from dispatch authority")
          payloads = manifest.get("payloads")
          expected_payloads = {
              "wheelhouse", "dashboard", "control_plane", "source_bundle", "python_runtime"
          }
          if not isinstance(payloads, dict) or set(payloads) != expected_payloads:
              raise SystemExit("release payload schema is not closed")
          control = payloads.get("control_plane")
          if (
              not isinstance(control, dict)
              or set(control)
              != {"archive", "archive_sha256", "tree_sha256", "file_count", "total_size"}
              or control.get("archive") != "control-plane.tar"
              or not isinstance(control.get("archive_sha256"), str)
              or sha256_re.fullmatch(control["archive_sha256"]) is None
              or not isinstance(control.get("tree_sha256"), str)
              or sha256_re.fullmatch(control["tree_sha256"]) is None
              or type(control.get("file_count")) is not int
              or not 1 <= control["file_count"] <= 1000
              or type(control.get("total_size")) is not int
              or not 1 <= control["total_size"] <= 64 * 1024 * 1024
          ):
              raise SystemExit("release control-plane authority is invalid")
          expected_files = {
              "release-manifest.json",
              "wheelhouse.tar",
              "dashboard-build.tar",
              "control-plane.tar",
              "source.bundle",
              "cpython-3.13.15+20260814-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz",
          }
          entries = list(os.scandir(bundle))
          if {entry.name for entry in entries} != expected_files or any(
              not entry.is_file(follow_symlinks=False) for entry in entries
          ):
              raise SystemExit("release bundle file set is not closed")

          control_path = bundle / "control-plane.tar"
          before = control_path.lstat()
          if (
              not stat.S_ISREG(before.st_mode)
              or stat.S_ISLNK(before.st_mode)
              or before.st_nlink != 1
              or before.st_size > 128 * 1024 * 1024
          ):
              raise SystemExit("release control-plane archive is unsafe")
          descriptor = os.open(
              control_path,
              os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0),
          )
          required_modules = {
              "scripts/ha/release_archive_contract.py",
              "scripts/ha/release_artifact_contract.py",
          }
          module_bytes: dict[str, bytes] = {}
          seen: set[str] = set()
          file_count = 0
          total_size = 0
          try:
              with os.fdopen(descriptor, "rb", closefd=False) as raw_control:
                  opened = os.fstat(descriptor)
                  if (opened.st_dev, opened.st_ino, opened.st_size) != (
                      before.st_dev,
                      before.st_ino,
                      before.st_size,
                  ):
                      raise SystemExit("release control-plane archive changed while opening")
                  archive_digest = hashlib.sha256()
                  for chunk in iter(lambda: raw_control.read(1024 * 1024), b""):
                      archive_digest.update(chunk)
                  if archive_digest.hexdigest() != control["archive_sha256"]:
                      raise SystemExit("release control-plane archive digest changed")
                  raw_control.seek(0)
                  with tarfile.open(fileobj=raw_control, mode="r:") as archive:
                      for member in archive:
                          name = member.name
                          parts = name.split("/")
                          if (
                              not name
                              or name.startswith("/")
                              or "\\" in name
                              or any(part in {"", ".", ".."} for part in parts)
                              or str(PurePosixPath(name)) != name
                              or any(ord(character) < 32 or ord(character) == 127 for character in name)
                              or name in seen
                          ):
                              raise SystemExit("release control-plane archive path is unsafe")
                          seen.add(name)
                          if (
                              set(member.pax_headers) - {"path"}
                              or ("path" in member.pax_headers and member.pax_headers["path"] != name)
                              or member.uid != 0
                              or member.gid != 0
                              or member.uname != ""
                              or member.gname != ""
                              or member.mtime != 0
                          ):
                              raise SystemExit("release control-plane archive metadata is invalid")
                          if member.isdir():
                              if member.mode != 0o755 or member.size != 0:
                                  raise SystemExit("release control-plane directory metadata is invalid")
                              continue
                          if not member.isreg() or member.mode not in {0o644, 0o755}:
                              raise SystemExit("release control-plane archive contains an unsafe object")
                          file_count += 1
                          total_size += member.size
                          if total_size > control["total_size"] or member.size > 16 * 1024 * 1024:
                              raise SystemExit("release control-plane archive exceeds its authority")
                          if name in required_modules:
                              source = archive.extractfile(member)
                              if source is None:
                                  raise SystemExit("release control module payload is missing")
                              value = source.read(1024 * 1024 + 1)
                              if len(value) != member.size or len(value) > 1024 * 1024:
                                  raise SystemExit("release control module size is invalid")
                              module_bytes[name] = value
                  after = os.fstat(descriptor)
                  if (after.st_size, after.st_mtime_ns) != (opened.st_size, opened.st_mtime_ns):
                      raise SystemExit("release control-plane archive changed while reading")
          except (OSError, tarfile.TarError) as exc:
