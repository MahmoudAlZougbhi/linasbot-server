                not stat.S_ISREG(source_info.st_mode)
                or stat.S_ISLNK(source_info.st_mode)
                or source_info.st_uid != source_uid
                or source_info.st_nlink != 1
                or stat.S_IMODE(source_info.st_mode) & 0o022
                or source_info.st_size != expected_size
            ):
                raise SystemExit("staged authority source is unsafe")
            source_fd = os.open(source, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
            try:
                opened = os.fstat(source_fd)
                if (opened.st_dev, opened.st_ino, opened.st_size) != (
                    source_info.st_dev,
                    source_info.st_ino,
                    expected_size,
                ):
                    raise SystemExit("staged authority source changed while opening")
                destination_fd = os.open(
                    destination,
                    os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0),
                    mode,
                )
                digest = hashlib.sha256()
                total = 0
                try:
                    while True:
                        chunk = os.read(source_fd, min(1 << 20, expected_size - total + 1))
                        if not chunk:
                            break
                        total += len(chunk)
                        if total > expected_size:
                            raise SystemExit("staged authority source exceeded its bound")
                        digest.update(chunk)
                        view = memoryview(chunk)
                        while view:
                            written = os.write(destination_fd, view)
                            view = view[written:]
                    if total != expected_size or digest.hexdigest() != expected_sha:
                        raise SystemExit("staged authority bytes differ from workflow evidence")
                    os.fchmod(destination_fd, mode)
                    os.fchown(destination_fd, 0, 0)
                    os.fsync(destination_fd)
                finally:
                    os.close(destination_fd)
                final_source = os.fstat(source_fd)
                if (
                    final_source.st_dev,
                    final_source.st_ino,
                    final_source.st_size,
                    final_source.st_mtime_ns,
                    final_source.st_ctime_ns,
                ) != (
                    opened.st_dev,
                    opened.st_ino,
                    opened.st_size,
                    opened.st_mtime_ns,
                    opened.st_ctime_ns,
                ):
