            import hashlib
            import json
            import os
            import re
            import stat
            import sys
            import tarfile
            from pathlib import Path

            destination = Path(sys.argv[1])
            target_sha, artifact_id, artifact_api_sha, manifest_sha = sys.argv[2:6]
            run_id, run_attempt, target_tree_sha = sys.argv[6:]
            state_root = Path("/var/lib/linasbot/meta-ha")
            bundle = state_root / "release-bundles" / f"{artifact_id}-{artifact_api_sha}"
            receipt = state_root / "release-bundle-receipts" / f"{artifact_id}-{artifact_api_sha}.json"
            digest_re = re.compile(r"[0-9a-f]{64}")

            def read_secure(path: Path, mode: int, limit: int) -> bytes:
                info = path.lstat()
                if (
                    not stat.S_ISREG(info.st_mode)
                    or stat.S_ISLNK(info.st_mode)
                    or info.st_uid != 0
                    or info.st_gid != 0
                    or info.st_nlink != 1
                    or stat.S_IMODE(info.st_mode) != mode
                    or info.st_size < 1
                    or info.st_size > limit
                ):
                    raise SystemExit("protected release authority is unsafe")
                descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
                try:
                    opened = os.fstat(descriptor)
                    if (opened.st_dev, opened.st_ino) != (info.st_dev, info.st_ino):
                        raise SystemExit("protected release authority changed while opening")
                    raw = b""
                    while len(raw) <= limit:
                        chunk = os.read(descriptor, min(1 << 20, limit + 1 - len(raw)))
                        if not chunk:
                            break
                        raw += chunk
                    if len(raw) != info.st_size:
                        raise SystemExit("protected release authority changed while reading")
                    return raw
                finally:
                    os.close(descriptor)

            def unique(pairs: list[tuple[str, object]]) -> dict[str, object]:
                result: dict[str, object] = {}
                for key, value in pairs:
                    if key in result:
                        raise ValueError("duplicate release authority key")
                    result[key] = value
                return result

            for directory, mode in (
                (state_root, 0o700),
                (bundle.parent, 0o700),
                (receipt.parent, 0o700),
                (bundle, 0o700),
            ):
                info = directory.lstat()
                if (
                    not stat.S_ISDIR(info.st_mode)
                    or stat.S_ISLNK(info.st_mode)
                    or info.st_uid != 0
                    or info.st_gid != 0
                    or stat.S_IMODE(info.st_mode) != mode
                ):
                    raise SystemExit("protected release directory is unsafe")
            receipt_raw = read_secure(receipt, 0o600, 1 << 20)
            receipt_payload = json.loads(receipt_raw, object_pairs_hook=unique)
            receipt_keys = {
                "schema", "format", "status", "node_id", "target_sha", "artifact_id",
                "artifact_api_sha256", "manifest_sha256", "run_id", "run_attempt",
                "target_tree_sha", "bundle_summary_sha256", "python_runtime_cluster_sha256",
            }
            if (
                not isinstance(receipt_payload, dict)
                or set(receipt_payload) != receipt_keys
                or receipt_raw != (json.dumps(receipt_payload, sort_keys=True, separators=(",", ":")) + "\n").encode()
                or receipt_payload["schema"] != 1
                or receipt_payload["format"] != "linasbot-release-bundle-install-v1"
                or receipt_payload["status"] != "installed"
                or receipt_payload["node_id"] != "node01"
                or receipt_payload["target_sha"] != target_sha
                or receipt_payload["artifact_id"] != int(artifact_id)
                or receipt_payload["artifact_api_sha256"] != artifact_api_sha
                or receipt_payload["manifest_sha256"] != manifest_sha
                or receipt_payload["run_id"] != int(run_id)
                or receipt_payload["run_attempt"] != int(run_attempt)
                or receipt_payload["target_tree_sha"] != target_tree_sha
                or digest_re.fullmatch(str(receipt_payload["bundle_summary_sha256"])) is None
                or digest_re.fullmatch(str(receipt_payload["python_runtime_cluster_sha256"])) is None
            ):
                raise SystemExit("protected release receipt differs from recovery authority")
            expected_files = {
                "release-manifest.json", "wheelhouse.tar", "dashboard-build.tar",
                "control-plane.tar", "source.bundle",
                "cpython-3.13.15+20260814-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz",
            }
            if {entry.name for entry in os.scandir(bundle)} != expected_files:
                raise SystemExit("protected release bundle file set is not closed")
            manifest_raw = read_secure(bundle / "release-manifest.json", 0o600, 1 << 20)
            if hashlib.sha256(manifest_raw).hexdigest() != manifest_sha:
                raise SystemExit("protected release manifest digest changed")
            manifest = json.loads(manifest_raw, object_pairs_hook=unique)
            if manifest_raw != (json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n").encode():
                raise SystemExit("protected release manifest is not canonical")
            if (
