name: Meta Social Token Validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Meta DM baseline and app webhook configuration
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate without rendering credentials
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
        run: |
          python scripts/validate_meta_social_token.py
          echo "Contract sections:"
          echo "  [baseline-dm] token, page relationship, conversations, page subscribed_apps (DM-only)"
          echo "  [app-webhooks] exact app-level fields with DM preserved"
          echo "  [feature-readiness] informational only; false does not fail this workflow"
