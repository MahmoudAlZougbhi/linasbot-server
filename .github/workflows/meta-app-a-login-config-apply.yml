# Apply App A Facebook-only Login for Business config (no token rotation / disconnect).
# Does not delete the legacy mixed config id META_APP_A_LOGIN_CONFIG_ID.
name: Meta App A Login Config Apply

on:
  workflow_dispatch:

concurrency:
  group: meta-app-a-login-config-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply App A Facebook login configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: meta-social-cutover
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy apply script to production
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: scripts/prod_apply_meta_app_a_login_config.sh
          target: /tmp/linasbot-meta-login-config

      - name: Set META_APP_A_FACEBOOK_LOGIN_CONFIG_ID on production
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_APP_A_FACEBOOK_LOGIN_CONFIG_ID: ${{ secrets.META_APP_A_FACEBOOK_LOGIN_CONFIG_ID }}
          META_OAUTH_REDIRECT_URI: https://www.linasaibot.com/oauth/meta/callback
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: META_APP_A_FACEBOOK_LOGIN_CONFIG_ID,META_OAUTH_REDIRECT_URI
          script: |
            set -euo pipefail
            if [ -z "${META_APP_A_FACEBOOK_LOGIN_CONFIG_ID:-}" ]; then
              echo "[meta-login-config] missing GitHub secret META_APP_A_FACEBOOK_LOGIN_CONFIG_ID" >&2
              exit 1
            fi
            if [ "${META_APP_A_FACEBOOK_LOGIN_CONFIG_ID}" = "1057282070324984" ]; then
              echo "[meta-login-config] refusing legacy mixed FB+IG config for Facebook Connect" >&2
              exit 1
            fi
            APPLY_SCRIPT="/tmp/linasbot-meta-login-config/scripts/prod_apply_meta_app_a_login_config.sh"
            if [ ! -f "$APPLY_SCRIPT" ] && [ -f /opt/linasbot/scripts/prod_apply_meta_app_a_login_config.sh ]; then
              APPLY_SCRIPT="/opt/linasbot/scripts/prod_apply_meta_app_a_login_config.sh"
            fi
            test -f "$APPLY_SCRIPT"
            sudo -E bash "$APPLY_SCRIPT"
