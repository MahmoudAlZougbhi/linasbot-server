# Retired. Customer Brain live lab must not run against production.
# LINAS_CUSTOMER_AI_LAB stays false (env-apply + prod scripts write/assert false).
name: Customer Brain Live Lab HA

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Retired — live lab must not run on production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  refuse:
    name: Refuse production live lab
    runs-on: ubuntu-latest
    steps:
      - name: Refuse production live lab
        run: |
          echo "Customer Brain live lab is retired. LINAS_CUSTOMER_AI_LAB must stay false."
          echo "This workflow no longer SSHs to production."
          exit 1
