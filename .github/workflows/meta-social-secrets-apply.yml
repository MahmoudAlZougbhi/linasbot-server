name: Meta Social Secrets Apply

on:
  workflow_dispatch:
    inputs:
      enable_messaging:
        description: "Set META_SOCIAL_MESSAGING_ENABLED=true only if readiness is complete"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: meta-social-secrets-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Meta secrets on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply secrets via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          APPLY_ENABLE_MESSAGING: ${{ inputs.enable_messaging }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: META_APP_ID,META_APP_SECRET,META_PAGE_ID,META_PAGE_ACCESS_TOKEN,META_INSTAGRAM_ACCOUNT_ID,META_WEBHOOK_VERIFY_TOKEN,META_GRAPH_API_VERSION,APPLY_ENABLE_MESSAGING
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_apply_meta_social_secrets.sh
            sudo -E bash /opt/linasbot/scripts/prod_apply_meta_social_secrets.sh
