# Apply Instagram Direct Login production secrets via SSH. Never logs secret values.
name: Instagram Login Secrets Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_INSTAGRAM_LOGIN_SECRETS to apply"
        required: true
        type: string

concurrency:
  group: instagram-login-secrets-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Instagram Login secrets on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.CONFIRM == 'APPLY_INSTAGRAM_LOGIN_SECRETS'
    steps:
      - name: Apply secrets via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_INSTAGRAM_LOGIN_APP_SECRET: ${{ secrets.META_INSTAGRAM_LOGIN_APP_SECRET }}
          META_INSTAGRAM_LOGIN_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_INSTAGRAM_LOGIN_WEBHOOK_VERIFY_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: META_INSTAGRAM_LOGIN_APP_SECRET,META_INSTAGRAM_LOGIN_WEBHOOK_VERIFY_TOKEN
          script: |
            set -e
            cd /opt/linasbot
            git fetch origin main
            git checkout origin/main -- scripts/prod_apply_instagram_login_secrets.sh
            chmod +x scripts/prod_apply_instagram_login_secrets.sh
            sudo -E bash /opt/linasbot/scripts/prod_apply_instagram_login_secrets.sh
