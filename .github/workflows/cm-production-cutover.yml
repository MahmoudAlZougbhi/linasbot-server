# Production Content Management cutover. Confirmation-gated SSH steps.
# Never prints secrets or customer message bodies.
# Uses if/elif (not case/;;) because appleboy/ssh-action mangles `;;` in remote scripts.
name: CM Production Cutover

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase to run"
        required: true
        type: choice
        options:
          - backup
          - migrate_validate
          - enable_publish_keep_legacy
          - publish
          - publish_faq_only
          - cutover_published
          - rollback_legacy
          - rollback_content_version
          - price_source_ledger
          - price_line_shape_probe
          - enable_faq_canonical
          - sot_audit_published
          - corpus_inventory
          - linas_content_audit
          - bridge_readiness
          - runtime_proof
          - generic_tenant_proof
          - disable_linas_legacy_bridge
          - preserve_durable_flags
          - verify_durable_bridge
          - import_prices
          - repair_linas_prices_publish
      confirmation:
        description: "Type CM_CUTOVER_CONFIRMED"
        required: true
        type: string
      content_version_id:
        description: "Required for rollback_content_version (e.g. v_f2e930f21c4c)"
        required: false
        type: string
        default: ""

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: CM production phase
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'CM_CUTOVER_CONFIRMED'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: meta-social-cutover
    steps:
      - name: Execute phase on production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          CONTENT_VERSION_ID: ${{ inputs.content_version_id }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 40m
          envs: EXPECTED_RELEASE_SHA,PHASE,CONTENT_VERSION_ID
          script: |
            set -euo pipefail
            REPO_DIR=/opt/linasbot
            guarded() {
              sudo -E "$REPO_DIR/venv/bin/python" \
                "$REPO_DIR/scripts/ha/production_mutation_guard.py" run \
                --expected-sha "$EXPECTED_RELEASE_SHA" \
                --script "$1" -- "${@:2}"
            }
            echo "[cm-workflow] phase=${PHASE}"
            TWO_NODE_ENV_PHASES=" enable_publish_keep_legacy cutover_published rollback_legacy enable_faq_canonical disable_linas_legacy_bridge preserve_durable_flags verify_durable_bridge "
            if [[ "$TWO_NODE_ENV_PHASES" == *" ${PHASE} "* ]]; then
              echo "[cm-workflow] BLOCKED: this phase needs a generic two-node env backup/sync/restart/rollback proof" >&2
              exit 2
            fi
            if [ "${PHASE}" = "backup" ]; then
              guarded scripts/prod_cm_backup.sh
            elif [ "${PHASE}" = "migrate_validate" ]; then
              guarded scripts/prod_cm_migrate_and_validate.sh
            elif [ "${PHASE}" = "enable_publish_keep_legacy" ]; then
              export CM_RUNTIME_MODE_VALUE=legacy
              export CM_PUBLISH_ENABLED_VALUE=true
              export CM_EMBEDDING_PROVIDER_VALUE=openai
              export CM_EMBEDDING_MODEL_VALUE=text-embedding-3-small
              guarded scripts/prod_cm_apply_flags.sh
            elif [ "${PHASE}" = "publish" ]; then
              guarded scripts/prod_cm_publish.sh
            elif [ "${PHASE}" = "publish_faq_only" ]; then
              guarded scripts/prod_cm_publish_faq_only.sh
            elif [ "${PHASE}" = "cutover_published" ]; then
              guarded scripts/prod_cm_cutover.sh
            elif [ "${PHASE}" = "rollback_legacy" ]; then
              export CM_PUBLISH_ENABLED_VALUE=false
              guarded scripts/prod_cm_rollback.sh
            elif [ "${PHASE}" = "rollback_content_version" ]; then
              if [ -z "${CONTENT_VERSION_ID}" ]; then
                echo "[cm-workflow] content_version_id required for rollback_content_version" >&2
                exit 1
              fi
              export CM_ROLLBACK_CONTENT_VERSION_ID="${CONTENT_VERSION_ID}"
              guarded scripts/prod_cm_rollback_version.sh
            elif [ "${PHASE}" = "price_source_ledger" ]; then
              guarded scripts/prod_cm_price_source_ledger.sh
            elif [ "${PHASE}" = "price_line_shape_probe" ]; then
              guarded scripts/prod_cm_price_line_shape_probe.sh
            elif [ "${PHASE}" = "enable_faq_canonical" ]; then
              export CM_RUNTIME_MODE_VALUE=published
              export CM_PUBLISH_ENABLED_VALUE=true
              export CM_FAQ_CANONICAL_VALUE=true
              export CM_EMBEDDING_PROVIDER_VALUE=openai
              export CM_EMBEDDING_MODEL_VALUE=text-embedding-3-small
              guarded scripts/prod_cm_apply_flags.sh
            elif [ "${PHASE}" = "sot_audit_published" ]; then
              guarded scripts/prod_cm_sot_audit.sh
            elif [ "${PHASE}" = "corpus_inventory" ]; then
              guarded scripts/prod_cm_corpus_inventory.sh
            elif [ "${PHASE}" = "linas_content_audit" ]; then
              guarded scripts/prod_cm_linas_content_audit.sh
            elif [ "${PHASE}" = "bridge_readiness" ]; then
              guarded scripts/prod_cm_bridge_readiness.sh
            elif [ "${PHASE}" = "runtime_proof" ]; then
              guarded scripts/prod_cm_runtime_proof.sh
            elif [ "${PHASE}" = "generic_tenant_proof" ]; then
              guarded scripts/prod_cm_generic_tenant_proof.sh
            elif [ "${PHASE}" = "disable_linas_legacy_bridge" ]; then
              guarded scripts/prod_cm_set_linas_bridge_flag.sh true
            elif [ "${PHASE}" = "preserve_durable_flags" ]; then
              guarded scripts/prod_cm_preserve_durable_flags.sh
            elif [ "${PHASE}" = "verify_durable_bridge" ]; then
              export VERIFY_RELOAD=1
              guarded scripts/prod_cm_verify_durable_bridge.sh
            elif [ "${PHASE}" = "import_prices" ]; then
              guarded scripts/prod_cm_import_prices.sh
            elif [ "${PHASE}" = "repair_linas_prices_publish" ]; then
              guarded scripts/prod_cm_repair_linas_prices_publish.sh
            else
              echo "unknown phase=${PHASE}" >&2
              exit 1
            fi
