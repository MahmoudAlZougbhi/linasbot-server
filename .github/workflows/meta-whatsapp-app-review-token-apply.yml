# Install or remove the temporary WhatsApp App Review token as one HA env transaction.
name: Meta WhatsApp App Review Token Apply

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Install for App Review testing or remove immediately after bind"
        required: true
        default: install
        type: choice
        options:
          - install
          - remove
      CONFIRM:
        description: "Type INSTALL_META_WHATSAPP_APP_REVIEW_TOKEN or REMOVE_META_WHATSAPP_APP_REVIEW_TOKEN"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply temporary WhatsApp App Review token on HA
    if: >-
      github.ref == 'refs/heads/main' &&
      ((inputs.action == 'install' && inputs.CONFIRM == 'INSTALL_META_WHATSAPP_APP_REVIEW_TOKEN') ||
       (inputs.action == 'remove' && inputs.CONFIRM == 'REMOVE_META_WHATSAPP_APP_REVIEW_TOKEN'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: meta-social-cutover
    steps:
      - name: Transactionally apply the App Review token on both nodes
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          META_WHATSAPP_APP_REVIEW_BIND_TOKEN: ${{ secrets.META_WHATSAPP_APP_REVIEW_BIND_TOKEN }}
          META_WHATSAPP_APP_REVIEW_ALLOWED_WABA_IDS: "1409769574350248"
          META_WHATSAPP_APP_REVIEW_TOKEN_ACTION: ${{ inputs.action }}
          META_WHATSAPP_APP_REVIEW_TOKEN_CONFIRM: ${{ inputs.CONFIRM }}
          META_HA_STAGE_ONLY: "true"
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # The remote script owns fail-closed cleanup; line rewriting can corrupt traps.
          script_stop: false
          command_timeout: 14m
          envs: EXPECTED_RELEASE_SHA,META_WHATSAPP_APP_REVIEW_BIND_TOKEN,META_WHATSAPP_APP_REVIEW_ALLOWED_WABA_IDS,META_WHATSAPP_APP_REVIEW_TOKEN_ACTION,META_WHATSAPP_APP_REVIEW_TOKEN_CONFIRM,META_HA_STAGE_ONLY
          script: |
            set -euo pipefail
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            DEPLOYED_RELEASE_SHA="$(git -C "$REPO_DIR" rev-parse HEAD)"
            if [ "$DEPLOYED_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]; then
              echo "[wa-app-review-token] workflow SHA does not match deployed release" >&2
              exit 1
            fi
            if ! git -C "$REPO_DIR" diff --quiet "$DEPLOYED_RELEASE_SHA" -- || \
               ! git -C "$REPO_DIR" diff --cached --quiet "$DEPLOYED_RELEASE_SHA" --; then
              echo "[wa-app-review-token] deployed tracked files differ from release SHA" >&2
              exit 1
            fi
            case "$META_WHATSAPP_APP_REVIEW_TOKEN_ACTION:$META_WHATSAPP_APP_REVIEW_TOKEN_CONFIRM" in
              install:INSTALL_META_WHATSAPP_APP_REVIEW_TOKEN)
                test "${#META_WHATSAPP_APP_REVIEW_BIND_TOKEN}" -ge 20
                ;;
              remove:REMOVE_META_WHATSAPP_APP_REVIEW_TOKEN) ;;
              *)
                echo "[wa-app-review-token] action confirmation mismatch" >&2
                exit 1
                ;;
            esac
            test "$META_WHATSAPP_APP_REVIEW_ALLOWED_WABA_IDS" = "1409769574350248"
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            MAINTENANCE_FILE=/run/linasbot-maintenance
            META_HA_STATE_ROOT=/var/lib/linasbot/meta-ha
            PERSISTENT_MAINTENANCE_FILE="$META_HA_STATE_ROOT/maintenance"
            ENV_BACKUP=""
            MAINTENANCE_ARMED=false
            TRANSACTION_COMPLETE=false
            fail_closed_cleanup() {
              status=$?
              trap - EXIT
              if [ "$TRANSACTION_COMPLETE" != "true" ]; then
                status=1
                if [ "$MAINTENANCE_ARMED" = "true" ]; then
                  sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT" || true
                  sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE" || true
                  install -m 0600 /dev/null "$MAINTENANCE_FILE" || true
                  ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                    "root@${PEER_HOST}" \
                    "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'" || true
                  echo "[wa-app-review-token] HA maintenance retained after uncertain transaction" >&2
                fi
                if [ -n "$ENV_BACKUP" ]; then
                  echo "[wa-app-review-token] exact pre-stage backup retained at $ENV_BACKUP" >&2
                fi
              else
                sudo rm -f "$ENV_BACKUP"
              fi
              exit "$status"
            }
            trap fail_closed_cleanup EXIT
            MAINTENANCE_ARMED=true
            sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT"
            sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE"
            sudo install -m 0600 -o root -g root /dev/null "$MAINTENANCE_FILE"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'"
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8003/api/ready || true)" = "503"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test \"\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8003/api/ready || true)\" = 503"
            DRAIN_SECONDS="$("$REPO_DIR/venv/bin/python" -c 'import sys; from dotenv import dotenv_values; value = int(str(dotenv_values(sys.argv[1], interpolate=False).get("META_HA_LB_DRAIN_SECONDS") or "")); sys.exit("invalid HA drain interval") if not 30 <= value <= 300 else print(value)' "$REPO_DIR/.env")"
            sleep "$DRAIN_SECONDS"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --recover-only
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" \
              "$EXPECTED_RELEASE_SHA" cluster-release-only
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --register-prestage-backup
            ENV_BACKUP="$META_HA_STATE_ROOT/env.before"
            APPLY_SCRIPT="$REPO_DIR/scripts/prod_apply_meta_whatsapp_app_review_token.sh"
            test -f "$APPLY_SCRIPT"
            bash "$APPLY_SCRIPT"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active \
              --local-prestage-backup "$ENV_BACKUP"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --finalize
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA"
            TRANSACTION_COMPLETE=true
            MAINTENANCE_ARMED=false
            echo "[wa-app-review-token] COMPLETE_OK action=$META_WHATSAPP_APP_REVIEW_TOKEN_ACTION nodes=2"
