name: Subscription Exempt Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only subscription exempt probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 8m
          script: |
            set -e
            cd /opt/linasbot
            echo "[probe] sha=$(git rev-parse HEAD)"
            echo "[probe] subject=$(git log -1 --pretty=%s)"
            APP_DIR=/opt/linasbot
            if [ -f /opt/linasbot/linaslaserbot-2.7.22/main.py ]; then APP_DIR=/opt/linasbot/linaslaserbot-2.7.22; fi
            cd "$APP_DIR"
            if [ -f venv/bin/activate ]; then
              # shellcheck disable=SC1091
              . venv/bin/activate
            fi
            PYTHON_BIN="$APP_DIR/venv/bin/python3"
            [ -x "$PYTHON_BIN" ] || PYTHON_BIN=$(command -v python3)
            echo "[probe] python_bin=$PYTHON_BIN"
            "$PYTHON_BIN" - <<'PY'
            from __future__ import annotations
            import os, sys
            from pathlib import Path
            from collections import Counter

            APP_DIR = "/opt/linasbot"
            if Path("/opt/linasbot/linaslaserbot-2.7.22/main.py").exists():
                APP_DIR = "/opt/linasbot/linaslaserbot-2.7.22"
            sys.path.insert(0, APP_DIR)
            os.chdir(APP_DIR)
            for env_path in (Path("/opt/linasbot/.env"), Path(APP_DIR) / ".env"):
                if not env_path.exists():
                    continue
                for line in env_path.read_text(encoding="utf-8", errors="replace").splitlines():
                    if not line or line.lstrip().startswith("#") or "=" not in line:
                        continue
                    k, v = line.split("=", 1)
                    os.environ.setdefault(k.strip(), v.strip().strip("'").strip('"'))

            raw = os.environ.get("SUBSCRIPTION_EXEMPT_TENANT_IDS")
            print(f"[probe] SUBSCRIPTION_EXEMPT_TENANT_IDS_set={raw is not None}")
            if raw is not None:
                stripped = raw.strip()
                print(f"[probe] SUBSCRIPTION_EXEMPT_TENANT_IDS_len={len(stripped)} empty={not bool(stripped)}")
            tw = os.environ.get("TOKEN_WALLET_UNLIMITED_TENANT_IDS")
            tw_stripped = (tw or "").strip()
            print(f"[probe] TOKEN_WALLET_UNLIMITED_set={tw is not None} len={len(tw_stripped)} empty={not bool(tw_stripped)}")
            linas_tid = os.environ.get("LINASBOT_TENANT_ID")
            linas_tid_stripped = (linas_tid or "").strip()
            print(f"[probe] LINASBOT_TENANT_ID_set={linas_tid is not None} empty={not bool(linas_tid_stripped)}")

            from services.entitlements_service import (
                is_subscription_exempt_tenant,
                subscription_exempt_tenant_ids,
                tenant_has_app_access,
                get_tenant_entitlement_public,
                entitlements_store,
            )
            print(f"[probe] exempt_ids_count={len(subscription_exempt_tenant_ids())}")
            print(f"[probe] linas_exempt={is_subscription_exempt_tenant('linas')}")
            print(f"[probe] linas_app_access={tenant_has_app_access('linas')}")
            try:
                pub = get_tenant_entitlement_public("linas")
                print(f"[probe] linas_public app_access={pub.get('app_access')} exempt={pub.get('subscription_exempt')} plan={pub.get('plan_id')} status={pub.get('status')}")
            except Exception as e:
                print(f"[probe] linas_public_ERROR type={type(e).__name__}")

            from storage.persistent_storage import _DATA_ROOT
            print(f"[probe] data_root={_DATA_ROOT}")
            ent_root = Path(_DATA_ROOT) / "entitlements"
            if not ent_root.exists():
                ent_root = Path(APP_DIR) / "data" / "entitlements"
            if not ent_root.exists():
                ent_root = Path("/opt/linasbot/data/entitlements")
            files = sorted(p.name for p in ent_root.glob("*.json")) if ent_root.exists() else []
            print(f"[probe] entitlement_files_count={len(files)}")

            try:
                from utils.utils import get_firestore_db
                db = get_firestore_db()
            except Exception as e:
                print(f"[probe] firestore_import_error type={type(e).__name__}")
                raise SystemExit(1)
            if not db:
                print("[probe] firestore_unavailable")
                raise SystemExit(1)
            MAX_DASHBOARD_USERS = 500
            coll = db.collection("artifacts").document("linas-ai-bot-backend").collection("dashboard_users")
            docs = list(coll.limit(MAX_DASHBOARD_USERS).stream())
            stream_bounded = len(docs) >= MAX_DASHBOARD_USERS
            tenant_counts = Counter()
            role_tenant = Counter()
            linas_roles = Counter()
            non_linas_admins = 0
            for doc in docs:
                data = doc.to_dict() or {}
                tid = str(data.get("tenantId") or data.get("tenant_id") or "MISSING").strip().lower() or "MISSING"
                role = str(data.get("role") or "unknown").strip().lower()
                status = str(data.get("status") or "").lower()
                tenant_counts[tid] += 1
                role_tenant[f"{role}|{tid}"] += 1
                if tid == "linas":
                    linas_roles[role] += 1
                if role in {"admin", "owner", "platform_owner"} and tid != "linas" and status in {"", "active"}:
                    non_linas_admins += 1
            print(f"[probe] users_sampled={len(docs)} stream_bounded={stream_bounded} max={MAX_DASHBOARD_USERS}")
            print(f"[probe] distinct_tenant_ids={len(tenant_counts)}")
            print(f"[probe] linas_role_counts={dict(linas_roles)}")
            # Role×tenant only for high-privilege roles (counts, no display names / emails).
            priv = {k: v for k, v in role_tenant.items() if k.split("|", 1)[0] in {"admin", "owner", "platform_owner"}}
            print(f"[probe] privileged_role_tenant_counts={dict(sorted(priv.items(), key=lambda kv: (-kv[1], kv[0]))[:40])}")
            print(f"[probe] non_linas_admin_or_owner_active={non_linas_admins}")
            # Evaluate app_access for every observed tenant id (ids only, no PII).
            for tid in sorted(tenant_counts):
                if tid in {"missing", "MISSING"}:
                    continue
                try:
                    print(f"[probe] access_for tenant={tid!r} exempt={is_subscription_exempt_tenant(tid)} app_access={tenant_has_app_access(tid)}")
                except Exception as e:
                    print(f"[probe] access_for_error tenant={tid!r} type={type(e).__name__}")

            try:
                from services.cm.version_store import load_published_content
                _p, sections = load_published_content("linas")
                basics = sections.get("ai_basics") or {}
                clinic_name = str(basics.get("clinic_name") or "").strip()
                print(f"[probe] linas_clinic_name_set={bool(clinic_name)} len={len(clinic_name)}")
            except Exception as e:
                print(f"[probe] cm_clinic_name_error type={type(e).__name__}")
            print("[probe] COMPLETE_OK")
            PY
