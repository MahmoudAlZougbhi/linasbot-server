name: WhatsApp Cloud Migrate + Phase1 Flags

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "PROVISION_WHATSAPP_POSTGRES_AND_PHASE1 | APPLY_WHATSAPP_CLOUD_PHASE1 | APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY | PROBE_WHATSAPP_DB"
        required: true
        type: string

concurrency:
  group: whatsapp-cloud-phase1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: WhatsApp Cloud Postgres / Phase 1 ops
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event.inputs.CONFIRM == 'PROVISION_WHATSAPP_POSTGRES_AND_PHASE1' ||
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1' ||
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY' ||
      github.event.inputs.CONFIRM == 'PROBE_WHATSAPP_DB'
    steps:
      - name: Ops via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            cd /opt/linasbot
            git fetch origin main
            git fetch origin ops/whatsapp-postgres-provision
            git reset --hard origin/main
            git show origin/ops/whatsapp-postgres-provision:scripts/prod_whatsapp_cloud_ssh_entry.sh > /tmp/prod_whatsapp_cloud_ssh_entry.sh
            sudo install -m 0755 /tmp/prod_whatsapp_cloud_ssh_entry.sh /opt/linasbot/scripts/prod_whatsapp_cloud_ssh_entry.sh
            sudo MODE='${{ github.event.inputs.CONFIRM }}' OPS_REF=origin/ops/whatsapp-postgres-provision bash /opt/linasbot/scripts/prod_whatsapp_cloud_ssh_entry.sh
