# Two-node HA transaction: WhatsApp Cloud Phase 1 flags + optional pilot grant for linas.
name: WhatsApp Cloud Phase 1 Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY"
        required: true
        type: string
      GRANT_PILOT:
        description: "Grant pilot to tenant linas after flags (true/false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ENABLE_WEB_CHAT:
        description: "Also enable WEB_CHAT_PUBLIC_AVAILABILITY in the same approval"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply WhatsApp Cloud Phase 1 flags (two-node)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: meta-social-cutover
    steps:
      - name: Two-node WhatsApp Phase 1 flags (+ optional pilot)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          META_HA_STAGE_ONLY: "true"
          GRANT_PILOT: ${{ github.event.inputs.GRANT_PILOT }}
          ENABLE_WEB_CHAT: ${{ github.event.inputs.ENABLE_WEB_CHAT }}
          WORKFLOW_SCRIPT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 22m
          envs: META_HA_STAGE_ONLY,GRANT_PILOT,ENABLE_WEB_CHAT,WORKFLOW_SCRIPT_SHA
          script: |
            set -euo pipefail
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            APPLY="$(mktemp)"
            trap 'rm -f "$APPLY"' EXIT
            curl -fsSL "https://raw.githubusercontent.com/MahmoudAlZougbhi/linasbot-server/${WORKFLOW_SCRIPT_SHA}/scripts/ha/whatsapp_phase1_apply_remote.sh" -o "$APPLY"
            chmod 700 "$APPLY"
            bash "$APPLY"
