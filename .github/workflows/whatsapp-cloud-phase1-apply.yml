name: BLOCKED - WhatsApp Cloud Phase 1 Apply Requires Two-Node HA

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_WHATSAPP_CLOUD_PHASE1 or APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blocked:
    if: >-
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1' ||
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY'
    runs-on: ubuntu-latest
    environment: meta-social-cutover
    steps:
      - name: Refuse node01-only environment mutation
        run: |
          echo "BLOCKED: WhatsApp phase-1 flags need an exact two-node env backup, sync, restart, worker proof, and rollback transaction." >&2
          echo "Use the separately serialized connection_source migration workflow for its DB-only migration." >&2
          exit 1
