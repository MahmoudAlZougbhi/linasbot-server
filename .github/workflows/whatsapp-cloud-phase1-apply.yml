# Two-node HA transaction: WhatsApp Cloud Phase 1 flags + optional pilot grant for linas.
name: WhatsApp Cloud Phase 1 Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY"
        required: true
        type: string
      GRANT_PILOT:
        description: "Grant pilot to tenant linas after flags (true/false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ENABLE_WEB_CHAT:
        description: "Also enable WEB_CHAT_PUBLIC_AVAILABILITY in the same approval"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply WhatsApp Cloud Phase 1 flags (two-node)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: meta-social-cutover
    steps:
      - name: Two-node WhatsApp Phase 1 flags (+ optional pilot)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          META_HA_STAGE_ONLY: "true"
          GRANT_PILOT: ${{ github.event.inputs.GRANT_PILOT }}
          ENABLE_WEB_CHAT: ${{ github.event.inputs.ENABLE_WEB_CHAT }}
          WORKFLOW_SCRIPT_SHA: ${{ github.sha }}
          WA_PHASE1_BUNDLE_B64: ''
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 45m
          envs: META_HA_STAGE_ONLY,GRANT_PILOT,ENABLE_WEB_CHAT,WORKFLOW_SCRIPT_SHA,WA_PHASE1_BUNDLE_B64
          script: |
            set -euo pipefail
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            echo "[wa-phase1-ha] bootstrap_start=true"
            install -d -m 1755 /run/lock
            LOCK_FILE=/run/lock/linasbot-meta-live.lock
            if ! flock -x -w 120 "$LOCK_FILE" true; then
              echo "[wa-phase1-ha] mutation_lock_wait_timeout=true" >&2
              if command -v fuser >/dev/null 2>&1; then
                stale="$(fuser "$LOCK_FILE" 2>/dev/null || true)"
                echo "[wa-phase1-ha] lock_holders=${stale:-none}" >&2
                _self_pid=$BASHPID
                for pid in $stale; do
                  [ -z "$pid" ] && continue
                  [ "$pid" = "$_self_pid" ] && continue
                  [ "$pid" = "$PPID" ] && continue
                  kill -TERM "$pid" 2>/dev/null || true
                done
                sleep 2
                stale="$(fuser "$LOCK_FILE" 2>/dev/null || true)"
                for pid in $stale; do
                  [ -z "$pid" ] && continue
                  [ "$pid" = "$_self_pid" ] && continue
                  [ "$pid" = "$PPID" ] && continue
                  kill -KILL "$pid" 2>/dev/null || true
                done
                sleep 1
              fi
            fi
            exec 9>"$LOCK_FILE"
            flock -x -w 30 9 || {
              echo "[wa-phase1-ha] mutation_lock_unavailable=true" >&2
              exit 1
            }
            echo "[wa-phase1-ha] mutation_lock_acquired=true"
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            BUNDLE_DIR="$(mktemp -d)"
            trap 'rm -rf "$BUNDLE_DIR"' EXIT
            printf '%s' "$WA_PHASE1_BUNDLE_B64" | base64 -d | tar -xzf - -C "$BUNDLE_DIR"
            export WORKFLOW_SCRIPT_DIR="$BUNDLE_DIR/scripts/ha"
            echo "[wa-phase1-ha] bundle_extracted=true"
            bash "$WORKFLOW_SCRIPT_DIR/whatsapp_phase1_apply_remote.sh"
