# Two-node HA transaction: WhatsApp Cloud Phase 1 flags + optional pilot grant for linas.
name: WhatsApp Cloud Phase 1 Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY"
        required: true
        type: string
      GRANT_PILOT:
        description: "Grant pilot to tenant linas after flags (true/false)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      ENABLE_WEB_CHAT:
        description: "Also enable WEB_CHAT_PUBLIC_AVAILABILITY in the same approval"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply WhatsApp Cloud Phase 1 flags (two-node)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.CONFIRM == 'APPLY_WHATSAPP_CLOUD_PHASE1_FLAGS_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: meta-social-cutover
    steps:
      - name: Two-node WhatsApp Phase 1 flags (+ optional pilot)
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          META_HA_STAGE_ONLY: "true"
          GRANT_PILOT: ${{ github.event.inputs.GRANT_PILOT }}
          ENABLE_WEB_CHAT: ${{ github.event.inputs.ENABLE_WEB_CHAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 22m
          envs: META_HA_STAGE_ONLY,GRANT_PILOT,ENABLE_WEB_CHAT
          script: |
            set -euo pipefail
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            DEPLOYED_RELEASE_SHA="$(git -C "$REPO_DIR" rev-parse HEAD)"
            export EXPECTED_RELEASE_SHA="$DEPLOYED_RELEASE_SHA"
            echo "[wa-phase1-ha] deployed_release_sha=${DEPLOYED_RELEASE_SHA}"
            if ! git -C "$REPO_DIR" diff --quiet "$DEPLOYED_RELEASE_SHA" -- || \
               ! git -C "$REPO_DIR" diff --cached --quiet "$DEPLOYED_RELEASE_SHA" --; then
              echo "[wa-phase1-ha] deployed tracked files differ from release SHA" >&2
              exit 1
            fi
            stage_whatsapp_phase1_flags() {
              export EXPECTED_RELEASE_SHA META_HA_STAGE_ONLY
              /opt/linasbot/venv/bin/python -I /opt/linasbot/scripts/ha/sync_meta_env_to_peer.py \
                --expected-sha "$EXPECTED_RELEASE_SHA" --verify-stage-authority
              /opt/linasbot/venv/bin/python -I - <<'PY'
            import hmac
            import sys
            from pathlib import Path

            sys.path.insert(0, "/opt/linasbot")
            from scripts.ha.meta_env_file import atomic_update_env

            env_path = Path("/opt/linasbot/.env")
            updates = {
                "WHATSAPP_CLOUD_CONNECTION_UI_ENABLED": "true",
                "WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED": "true",
                "WHATSAPP_CLOUD_OUTBOUND_SENDS_ENABLED": "true",
                "WHATSAPP_CLOUD_AI_REPLIES_ENABLED": "true",
                "WHATSAPP_CLOUD_HISTORY_SYNC_ENABLED": "false",
                "WHATSAPP_CLOUD_REQUIRE_PILOT_ENTITLEMENT": "true",
                "WHATSAPP_CLOUD_PUBLIC_AVAILABILITY": "false",
            }
            atomic_update_env(env_path, updates)

            def read_values(key: str) -> list[str]:
                return [
                    line.split("=", 1)[1]
                    for line in env_path.read_text(encoding="utf-8", errors="strict").splitlines()
                    if "=" in line
                    and not line.lstrip().startswith("#")
                    and line.split("=", 1)[0].strip() == key
                ]

            for key, expected in updates.items():
                values = read_values(key)
                if len(values) != 1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[wa-phase1-stage] staged value mismatch: {key}")
                print(f"[wa-phase1-stage] {key}:match=true")
            print("[wa-phase1-stage] COMPLETE_OK")
            PY
            }
            grant_linas_pilot_if_requested() {
              if [ "${GRANT_PILOT:-true}" != "true" ]; then
                echo "[wa-pilot-grant] skipped=true"
                return 0
              fi
              if [ -x "$REPO_DIR/scripts/prod_grant_whatsapp_pilot.py" ] || [ -f "$REPO_DIR/scripts/prod_grant_whatsapp_pilot.py" ]; then
                "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/prod_grant_whatsapp_pilot.py" \
                  --tenant-id linas \
                  --reason "Internal WhatsApp coexistence pilot after Phase 1 flags" \
                  --granted-by production_ops
                return 0
              fi
              "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import sys

            sys.path.insert(0, "/opt/linasbot")
            from db.session import WhatsAppDatabaseUnavailable, whatsapp_session
            from services.whatsapp_cloud.repository import WhatsAppCloudRepository

            tenant_id = "linas"
            reason = "Internal WhatsApp coexistence pilot after Phase 1 flags"
            try:
                with whatsapp_session(require=True) as session:
                    repo = WhatsAppCloudRepository(session)
                    existing = repo.get_active_pilot(tenant_id)
                    if existing is not None:
                        print(f"[wa-pilot-grant] already_active=true tenant_id={tenant_id}")
                        raise SystemExit(0)
                    row = repo.grant_pilot(
                        tenant_id=tenant_id,
                        granted_by_user_id="production_ops",
                        reason=reason,
                    )
                    repo.add_audit(
                        tenant_id=tenant_id,
                        actor_user_id="production_ops",
                        event_type="pilot_granted",
                        detail={"reason": reason, "source": "wa-phase1-ha-inline"},
                    )
                    print(f"[wa-pilot-grant] granted=true tenant_id={row.tenant_id} status={row.status}")
            except WhatsAppDatabaseUnavailable:
                print("[wa-pilot-grant] WHATSAPP_DB_UNAVAILABLE", file=sys.stderr)
                raise SystemExit(3) from None
            PY
            }
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            MAINTENANCE_FILE=/run/linasbot-maintenance
            META_HA_STATE_ROOT=/var/lib/linasbot/meta-ha
            PERSISTENT_MAINTENANCE_FILE="$META_HA_STATE_ROOT/maintenance"
            ENV_BACKUP=""
            MAINTENANCE_ARMED=false
            TRANSACTION_COMPLETE=false
            fail_closed_cleanup() {
              status=$?
              trap - EXIT
              if [ "$TRANSACTION_COMPLETE" != "true" ]; then
                status=1
                if [ "$MAINTENANCE_ARMED" = "true" ]; then
                  sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT" || true
                  sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE" || true
                  install -m 0600 /dev/null "$MAINTENANCE_FILE" || true
                  ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                    "root@${PEER_HOST}" \
                    "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'" || true
                  echo "[wa-phase1-ha] HA maintenance retained after uncertain transaction" >&2
                fi
                if [ -n "$ENV_BACKUP" ]; then
                  echo "[wa-phase1-ha] exact pre-stage backup retained at $ENV_BACKUP" >&2
                fi
              else
                sudo rm -f "$ENV_BACKUP"
              fi
              exit "$status"
            }
            trap fail_closed_cleanup EXIT
            MAINTENANCE_ARMED=true
            sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT"
            sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE"
            sudo install -m 0600 -o root -g root /dev/null "$MAINTENANCE_FILE"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'"
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8003/api/ready || true)" = "503"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test \"\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8003/api/ready || true)\" = \"503\""
            DRAIN_SECONDS="$("$REPO_DIR/venv/bin/python" -c 'import sys; from dotenv import dotenv_values; value = int(str(dotenv_values(sys.argv[1], interpolate=False).get("META_HA_LB_DRAIN_SECONDS") or "")); sys.exit("invalid HA drain interval") if not 30 <= value <= 300 else print(value)' "$REPO_DIR/.env")"
            sleep "$DRAIN_SECONDS"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --recover-only
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" \
              "$EXPECTED_RELEASE_SHA" cluster-release-only
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --register-prestage-backup
            ENV_BACKUP="$META_HA_STATE_ROOT/env.before"
            if [ -f "$REPO_DIR/scripts/prod_stage_whatsapp_cloud_phase1_flags.sh" ]; then
              bash "$REPO_DIR/scripts/prod_stage_whatsapp_cloud_phase1_flags.sh"
              ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                "root@${PEER_HOST}" \
                "export EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' META_HA_STAGE_ONLY=true LINAS_PRODUCTION_MUTATION_LOCK_FD=9; bash '$REPO_DIR/scripts/prod_stage_whatsapp_cloud_phase1_flags.sh'"
            else
              stage_whatsapp_phase1_flags
              ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                "root@${PEER_HOST}" \
                "export EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' META_HA_STAGE_ONLY=true LINAS_PRODUCTION_MUTATION_LOCK_FD=9; bash -s" <<'STAGEEOF'
            set -euo pipefail
            /opt/linasbot/venv/bin/python -I /opt/linasbot/scripts/ha/sync_meta_env_to_peer.py \
              --expected-sha "$EXPECTED_RELEASE_SHA" --verify-stage-authority
            /opt/linasbot/venv/bin/python -I - <<'PY'
            import hmac
            import sys
            from pathlib import Path

            sys.path.insert(0, "/opt/linasbot")
            from scripts.ha.meta_env_file import atomic_update_env

            env_path = Path("/opt/linasbot/.env")
            updates = {
                "WHATSAPP_CLOUD_CONNECTION_UI_ENABLED": "true",
                "WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED": "true",
                "WHATSAPP_CLOUD_OUTBOUND_SENDS_ENABLED": "true",
                "WHATSAPP_CLOUD_AI_REPLIES_ENABLED": "true",
                "WHATSAPP_CLOUD_HISTORY_SYNC_ENABLED": "false",
                "WHATSAPP_CLOUD_REQUIRE_PILOT_ENTITLEMENT": "true",
                "WHATSAPP_CLOUD_PUBLIC_AVAILABILITY": "false",
            }
            atomic_update_env(env_path, updates)

            def read_values(key: str) -> list[str]:
                return [
                    line.split("=", 1)[1]
                    for line in env_path.read_text(encoding="utf-8", errors="strict").splitlines()
                    if "=" in line
                    and not line.lstrip().startswith("#")
                    and line.split("=", 1)[0].strip() == key
                ]

            for key, expected in updates.items():
                values = read_values(key)
                if len(values) != 1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[wa-phase1-stage] staged value mismatch: {key}")
                print(f"[wa-phase1-stage] {key}:match=true")
            print("[wa-phase1-stage] COMPLETE_OK")
            PY
            STAGEEOF
            fi
            "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import os
            import traceback
            from pathlib import Path

            import sys

            sys.path.insert(0, "/opt/linasbot")
            import scripts.ha.sync_meta_env_to_peer as sync

            state_root = Path("/var/lib/linasbot/meta-ha")
            backup = state_root / "env.before"
            expected_sha = os.environ["EXPECTED_RELEASE_SHA"]
            probe = state_root / ".commit_probe"
            checks = {
                "backup_exists": lambda: backup.exists(),
                "backup_read": lambda: backup.read_bytes(),
                "runtime_meta": lambda: sync._read_runtime_meta_values(sync.LOCAL_NODE_ID),
                "backup_meta": lambda: sync._read_meta_values(backup),
                "samefile_self": lambda: backup.samefile(backup),
                "journal_absent": lambda: sync._load_journal(state_root),
                "atomic_write_probe": lambda: sync._atomic_write_bytes(probe, b"ok\n"),
                "stage_authority": lambda: sync._require_stage_authority(
                    state_root,
                    expected_sha=expected_sha,
                    require_preimage=False,
                ),
            }
            for name, fn in checks.items():
                try:
                    result = fn()
                    if name == "journal_absent":
                        print(f"[wa-phase1-commit-preflight] {name}={result is None}", flush=True)
                    else:
                        print(f"[wa-phase1-commit-preflight] {name}=ok", flush=True)
                except Exception as exc:
                    print(
                        f"[wa-phase1-commit-preflight] {name}={type(exc).__name__}:{exc}",
                        file=sys.stderr,
                        flush=True,
                    )
                    traceback.print_exc()
                    raise SystemExit(1) from exc
            probe.unlink(missing_ok=True)
            print("[wa-phase1-commit-preflight] COMPLETE_OK", flush=True)
            PY
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active \
              --local-prestage-backup "$ENV_BACKUP"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --finalize
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA"
            grant_linas_pilot_if_requested
            curl -fsS https://linasaibot.com/api/ready >/tmp/wa-ready.json
            "$REPO_DIR/venv/bin/python" - <<'PY'
            import json
            data = json.load(open("/tmp/wa-ready.json"))
            assert data.get("ok") is True, data
            checks = data.get("checks") or {}
            wa_db = ((checks.get("tiktok_business") or {}).get("config_keys_present") or {}).get("LINAS_WHATSAPP_DATABASE_URL")
            assert wa_db is True, checks
            print("[wa-phase1-ha] ready_ok=true whatsapp_db_present=true")
            PY
            TRANSACTION_COMPLETE=true
            MAINTENANCE_ARMED=false
            echo "[wa-phase1-ha] COMPLETE_OK"
            if [ "${ENABLE_WEB_CHAT:-true}" = "true" ]; then
              export META_HA_STAGE_ONLY=true SKIP_MUTATION_LOCK=true
              if [ -f "$REPO_DIR/scripts/prod_apply_web_chat_public_ha.sh" ]; then
                bash "$REPO_DIR/scripts/prod_apply_web_chat_public_ha.sh"
              else
                bash -s <<'WEBINLINE'
            set -euo pipefail
            REPO_DIR=/opt/linasbot
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            META_HA_STATE_ROOT=/var/lib/linasbot/meta-ha
            ENV_BACKUP="$META_HA_STATE_ROOT/env.before"
            PY="$REPO_DIR/venv/bin/python"
            install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT"
            install -m 0600 -o root -g root /dev/null "$META_HA_STATE_ROOT/maintenance"
            install -m 0600 -o root -g root /dev/null /run/linasbot-maintenance
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "root@${PEER_HOST}" \
              "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$META_HA_STATE_ROOT/maintenance' && install -m 0600 -o root -g root /dev/null '/run/linasbot-maintenance'"
            DRAIN_SECONDS="$("$PY" -c 'import sys; from dotenv import dotenv_values; value = int(str(dotenv_values(sys.argv[1], interpolate=False).get("META_HA_LB_DRAIN_SECONDS") or "")); sys.exit("invalid HA drain interval") if not 30 <= value <= 300 else print(value)' "$REPO_DIR/.env")"
            sleep "$DRAIN_SECONDS"
            "$PY" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --recover-only
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA" cluster-release-only
            "$PY" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --register-prestage-backup
            "$PY" -I - <<'PY'
            import hmac, sys
            from pathlib import Path
            sys.path.insert(0, "/opt/linasbot")
            from scripts.ha.meta_env_file import atomic_update_env
            env_path = Path("/opt/linasbot/.env")
            updates = {"WEB_CHAT_PUBLIC_AVAILABILITY": "true"}
            atomic_update_env(env_path, updates)
            for key, expected in updates.items():
                values = [line.split("=", 1)[1] for line in env_path.read_text(encoding="utf-8").splitlines() if "=" in line and line.split("=",1)[0].strip()==key]
                if len(values)!=1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[web-chat-stage] staged value mismatch: {key}")
                print(f"[web-chat-stage] {key}:match=true")
            print("[web-chat-stage] COMPLETE_OK")
            PY
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "root@${PEER_HOST}" "export EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' META_HA_STAGE_ONLY=true; bash -s" <<'STAGEEOF'
            set -euo pipefail
            /opt/linasbot/venv/bin/python -I /opt/linasbot/scripts/ha/sync_meta_env_to_peer.py --expected-sha "$EXPECTED_RELEASE_SHA" --verify-stage-authority
            /opt/linasbot/venv/bin/python -I - <<'PY'
            import hmac, sys
            from pathlib import Path
            sys.path.insert(0, "/opt/linasbot")
            from scripts.ha.meta_env_file import atomic_update_env
            env_path = Path("/opt/linasbot/.env")
            updates = {"WEB_CHAT_PUBLIC_AVAILABILITY": "true"}
            atomic_update_env(env_path, updates)
            for key, expected in updates.items():
                values = [line.split("=", 1)[1] for line in env_path.read_text(encoding="utf-8").splitlines() if "=" in line and line.split("=",1)[0].strip()==key]
                if len(values)!=1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[web-chat-stage] staged value mismatch: {key}")
                print(f"[web-chat-stage] {key}:match=true")
            print("[web-chat-stage] COMPLETE_OK")
            PY
            STAGEEOF
            "$PY" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --local-prestage-backup "$ENV_BACKUP"
            "$PY" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" --expected-sha "$EXPECTED_RELEASE_SHA" --finalize
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA"
            echo "[web-chat-ha] COMPLETE_OK"
            WEBINLINE
              fi
            fi
            echo "[prod-social-enable] COMPLETE_OK"
