name: OpenAI API Key Apply

on:
  workflow_dispatch:

concurrency:
  group: openai-api-key-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply OPENAI_API_KEY on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Apply OpenAI key via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: OPENAI_API_KEY
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_apply_openai_api_key.sh
            sudo -E bash /opt/linasbot/scripts/prod_apply_openai_api_key.sh
            sudo -E bash /opt/linasbot/scripts/prod_verify_canonical_social_ai.sh
