name: Meta Multi-App Secrets Apply

on:
  workflow_dispatch:
    inputs:
      enable_registry:
        description: "Enable registry only after App A bindings seed and readiness pass"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Stage encrypted Meta app registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: meta-social-cutover
    steps:
      - name: Apply, seed App A, and fail back safely
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          META_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.META_CREDENTIAL_ENCRYPTION_KEY }}
          META_APP_B_ID: ${{ secrets.META_APP_B_ID }}
          META_APP_B_SECRET: ${{ secrets.META_APP_B_SECRET }}
          META_APP_B_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_APP_B_WEBHOOK_VERIFY_TOKEN }}
          META_APP_B_LOGIN_CONFIG_ID: ${{ secrets.META_APP_B_LOGIN_CONFIG_ID }}
          META_APP_A_ADVANCED_ACCESS_APPROVED: "false"
          META_APP_B_ADVANCED_ACCESS_APPROVED: "false"
          APPLY_META_MULTI_APP_REGISTRY_ENABLED: ${{ inputs.enable_registry }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: META_APP_ID,META_APP_SECRET,META_PAGE_ID,META_PAGE_ACCESS_TOKEN,META_INSTAGRAM_ACCOUNT_ID,META_WEBHOOK_VERIFY_TOKEN,META_GRAPH_API_VERSION,META_CREDENTIAL_ENCRYPTION_KEY,META_APP_B_ID,META_APP_B_SECRET,META_APP_B_WEBHOOK_VERIFY_TOKEN,META_APP_B_LOGIN_CONFIG_ID,META_APP_A_ADVANCED_ACCESS_APPROVED,META_APP_B_ADVANCED_ACCESS_APPROVED,APPLY_META_MULTI_APP_REGISTRY_ENABLED
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_apply_meta_multi_app.sh
            sudo -E bash /opt/linasbot/scripts/prod_apply_meta_multi_app.sh
