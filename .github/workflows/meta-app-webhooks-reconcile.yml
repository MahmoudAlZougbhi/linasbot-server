name: Meta App Webhooks Reconcile

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RECONCILE_META_DM_WEBHOOKS"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile Page and Instagram DM webhook fields
    if: inputs.confirmation == 'RECONCILE_META_DM_WEBHOOKS'
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconcile without rendering credentials
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
        run: python scripts/reconcile_meta_app_webhooks.py
