name: BLOCKED - HA SSH Bootstrap Requires a Recoverable Transaction

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type HA_SSH_BOOTSTRAP_CONFIRM to acknowledge the blocked operation"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blocked:
    if: ${{ inputs.confirm == 'HA_SSH_BOOTSTRAP_CONFIRM' }}
    runs-on: ubuntu-latest
    environment: meta-social-cutover
    steps:
      - name: Refuse non-transactional root SSH mutation
        run: |
          echo "BLOCKED: root authorized_keys changes require a strict key parser, atomic backup/CAS, rollback, and HA bootstrap transaction." >&2
          exit 1
