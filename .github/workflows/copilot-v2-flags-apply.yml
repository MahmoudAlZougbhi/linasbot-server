name: Copilot V2 Flags Apply

# Apply Owner Copilot V2 + Customer Reply AI V2 production flags.
# Does not touch Meta tokens / App Review / Redis-required.

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_COPILOT_V2_FLAGS to apply"
        required: true
        type: string

concurrency:
  group: copilot-v2-flags-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Copilot V2 flags on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.CONFIRM == 'APPLY_COPILOT_V2_FLAGS'
    steps:
      - name: Apply flags via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd /opt/linasbot
            git fetch origin main
            # Always refresh apply script from origin/main so flag keys stay current.
            git show origin/main:scripts/prod_apply_copilot_v2_flags.sh > /tmp/prod_apply_copilot_v2_flags.sh
            sudo install -m 0755 /tmp/prod_apply_copilot_v2_flags.sh /opt/linasbot/scripts/prod_apply_copilot_v2_flags.sh
            sudo bash /opt/linasbot/scripts/prod_apply_copilot_v2_flags.sh
            curl -fsS https://linasaibot.com/api/ready >/tmp/ready.json
            python3 - <<'PY'
            import json
            d=json.load(open("/tmp/ready.json"))
            assert d.get("ok") is True, d
            jq=d.get("checks",{}).get("job_queue",{})
            assert jq.get("redis_required") is not True, jq
            print("[copilot-v2-flags] ready ok; redis_required=", jq.get("redis_required"))
            PY
