# Apply Resend SENDING_ONLY runtime secrets to production host .env.
# Runtime SoT is /opt/linasbot/.env (systemd EnvironmentFile), not GH deploy inject.
# No protected "production" Environment exists — repo secrets (same as OpenAI apply).
# Does NOT merge/deploy PR #240. Never prints secret values.
name: Resend Secrets Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_RESEND_SECRETS to apply"
        required: true
        type: string

concurrency:
  group: resend-secrets-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply-node01:
    name: Apply Resend secrets (SSH_HOST / node01)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.CONFIRM == 'APPLY_RESEND_SECRETS'
    steps:
      - name: Checkout apply script
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/prod_apply_resend_secrets.sh
          sparse-checkout-cone-mode: false

      - name: Upload apply script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "scripts/prod_apply_resend_secrets.sh"
          target: "/tmp/"
          strip_components: 1

      - name: Apply via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RESEND_FROM_EMAIL: no-reply@linasaibot.com
          RESEND_FROM_NAME: Linas AI
          RESEND_REPLY_TO: support@linasaibot.com
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: RESEND_API_KEY,RESEND_WEBHOOK_SECRET,RESEND_FROM_EMAIL,RESEND_FROM_NAME,RESEND_REPLY_TO
          script: |
            set -euo pipefail
            test -n "${RESEND_API_KEY:-}"
            test -n "${RESEND_WEBHOOK_SECRET:-}"
            chmod 700 /tmp/prod_apply_resend_secrets.sh
            sudo -E bash /tmp/prod_apply_resend_secrets.sh
            shred -u /tmp/prod_apply_resend_secrets.sh 2>/dev/null || rm -f /tmp/prod_apply_resend_secrets.sh
