name: Security Checks

on:
  pull_request:
  push:
    branches: [main, fix/**]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Block tracked Monty API keys
        run: |
          set -euo pipefail
          if rg -n '"api_key"\s*:\s*"[^"]{16,}"' config/montymobile_templates.json; then
            echo "Tracked Monty api_key must be empty; use MONTYMOBILE_API_KEY env"
            exit 1
          fi
      - name: Block common secret patterns in tracked files
        run: |
          set -euo pipefail
          # Fail if high-entropy OpenAI/Meta-like tokens appear outside env examples
          if rg -n --glob '!*.md' --glob '!.env*' --glob '!node_modules/**' \
              -e 'sk-proj-[A-Za-z0-9_-]{20,}' \
              -e 'EAA[A-Za-z0-9]{30,}' \
              -e 'admin123' \
              . ; then
            echo "Potential secret or default password found in tracked files"
            exit 1
          fi
          echo "Secret scan passed"
