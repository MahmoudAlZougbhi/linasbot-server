name: Security Checks

on:
  pull_request:
  push:
    branches: [main, fix/**]

permissions:
  contents: read

jobs:
  secret-scan:
    name: security-secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Block common secret patterns in tracked files
        run: bash scripts/scan_tracked_secrets.sh
