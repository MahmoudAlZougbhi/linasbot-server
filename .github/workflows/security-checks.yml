name: Security Checks

on:
  pull_request:
  push:
    branches: [main, fix/**]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Block common secret patterns in tracked files
        run: bash scripts/scan_tracked_secrets.sh
