name: Meta Comment Runtime Probe

on:
  workflow_dispatch:

concurrency:
  group: meta-comment-runtime-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Read-only Meta comment runtime probe
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe comment webhook logs on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/linasbot
            # Prefer deployed script; refresh from origin/main only if missing.
            # Do not soft-checkout a stale feature branch.
            if [ ! -f /opt/linasbot/scripts/prod_meta_comment_runtime_probe.py ]; then
              git fetch origin main
              git show origin/main:scripts/prod_meta_comment_runtime_probe.py > /tmp/prod_meta_comment_runtime_probe.py
              install -m 0755 /tmp/prod_meta_comment_runtime_probe.py /opt/linasbot/scripts/prod_meta_comment_runtime_probe.py
            fi
            python3 /opt/linasbot/scripts/prod_meta_comment_runtime_probe.py
