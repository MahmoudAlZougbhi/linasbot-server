# Two-node HA: stage VOYAGE_API_KEY + Customer Brain lab flags, then commit via restart.
# Never prints secret values. Brain is permanent (no enable flag).
name: Customer Brain Env Apply HA

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_CUSTOMER_BRAIN_VOYAGE_AND_LAB_FLAGS"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply Voyage + Brain lab flags (two-node)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.CONFIRM == 'APPLY_CUSTOMER_BRAIN_VOYAGE_AND_LAB_FLAGS'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: meta-social-cutover
    steps:
      - name: Two-node Voyage + lab flags
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        env:
          META_HA_STAGE_ONLY: "true"
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 30m
          envs: META_HA_STAGE_ONLY,VOYAGE_API_KEY
          script: |
            set -euo pipefail
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            if [ -z "${VOYAGE_API_KEY:-}" ] || [ "${#VOYAGE_API_KEY}" -lt 20 ]; then
              echo "[brain-env-ha] VOYAGE_API_KEY missing or too short" >&2
              exit 1
            fi
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            DEPLOYED_RELEASE_SHA="$(git -C "$REPO_DIR" rev-parse HEAD)"
            export EXPECTED_RELEASE_SHA="$DEPLOYED_RELEASE_SHA"
            echo "[brain-env-ha] deployed_release_sha=${DEPLOYED_RELEASE_SHA}"
            if ! git -C "$REPO_DIR" diff --quiet "$DEPLOYED_RELEASE_SHA" -- || \
               ! git -C "$REPO_DIR" diff --cached --quiet "$DEPLOYED_RELEASE_SHA" --; then
              echo "[brain-env-ha] deployed tracked files differ from release SHA" >&2
              exit 1
            fi
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            MAINTENANCE_FILE=/run/linasbot-maintenance
            META_HA_STATE_ROOT=/var/lib/linasbot/meta-ha
            PERSISTENT_MAINTENANCE_FILE="$META_HA_STATE_ROOT/maintenance"
            ENV_BACKUP=""
            MAINTENANCE_ARMED=false
            TRANSACTION_COMPLETE=false
            fail_closed_cleanup() {
              status=$?
              trap - EXIT
              if [ "$TRANSACTION_COMPLETE" != "true" ]; then
                status=1
                if [ "$MAINTENANCE_ARMED" = "true" ]; then
                  sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT" || true
                  sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE" || true
                  install -m 0600 /dev/null "$MAINTENANCE_FILE" || true
                  ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                    "root@${PEER_HOST}" \
                    "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'" || true
                  echo "[brain-env-ha] HA maintenance retained after uncertain transaction" >&2
                fi
                if [ -n "$ENV_BACKUP" ]; then
                  echo "[brain-env-ha] exact pre-stage backup retained at $ENV_BACKUP" >&2
                fi
              else
                sudo rm -f "$ENV_BACKUP"
              fi
              exit "$status"
            }
            trap fail_closed_cleanup EXIT
            MAINTENANCE_ARMED=true
            sudo install -d -m 0700 -o root -g root "$META_HA_STATE_ROOT"
            sudo install -m 0600 -o root -g root /dev/null "$PERSISTENT_MAINTENANCE_FILE"
            sudo install -m 0600 -o root -g root /dev/null "$MAINTENANCE_FILE"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "install -d -m 0700 -o root -g root '$META_HA_STATE_ROOT' && install -m 0600 -o root -g root /dev/null '$PERSISTENT_MAINTENANCE_FILE' && install -m 0600 -o root -g root /dev/null '$MAINTENANCE_FILE'"
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8003/api/ready || true)" = "503"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test \"\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8003/api/ready || true)\" = \"503\""
            DRAIN_SECONDS="$("$REPO_DIR/venv/bin/python" -c 'import sys; from dotenv import dotenv_values; value = int(str(dotenv_values(sys.argv[1], interpolate=False).get("META_HA_LB_DRAIN_SECONDS") or "")); sys.exit("invalid HA drain interval") if not 30 <= value <= 300 else print(value)' "$REPO_DIR/.env")"
            sleep "$DRAIN_SECONDS"
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --recover-only
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" \
              "$EXPECTED_RELEASE_SHA" cluster-release-only
            "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$EXPECTED_RELEASE_SHA" --maintenance-active --register-prestage-backup
            ENV_BACKUP="$META_HA_STATE_ROOT/env.before"
            # Pass Voyage to peer via stdin-bound env file (never argv).
            VOYAGE_STAGE_DIR="$(mktemp -d /run/linasbot-voyage-stage.XXXXXX)"
            install -m 0600 /dev/null "$VOYAGE_STAGE_DIR/voyage.env"
            printf 'VOYAGE_API_KEY=%s\n' "$VOYAGE_API_KEY" >"$VOYAGE_STAGE_DIR/voyage.env"
            if [ -x "$REPO_DIR/scripts/prod_stage_customer_brain_env.sh" ]; then
              bash "$REPO_DIR/scripts/prod_stage_customer_brain_env.sh"
            else
              "$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
                --expected-sha "$EXPECTED_RELEASE_SHA" --verify-stage-authority
              "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import hashlib
            import hmac
            import os
            import sys

            sys.path.insert(0, "/opt/linasbot")
            from pathlib import Path
            from scripts.ha.meta_env_file import atomic_update_env

            voyage = os.environ["VOYAGE_API_KEY"].strip()
            if len(voyage) < 20:
                raise SystemExit("[brain-env-stage] voyage length_too_short")
            updates = {
                "VOYAGE_API_KEY": voyage,
                "LINAS_CUSTOMER_AI_LAB": "true",
                "EMERGENCY_LEGACY_REPLY_ENABLED": "false",
                "MESSAGE_BILLING_CUTOVER": "false",
                "MESSAGE_BILLING_ENABLED": "false",
            }
            atomic_update_env(Path("/opt/linasbot/.env"), updates)
            text = open("/opt/linasbot/.env", encoding="utf-8").read().splitlines()
            for key, expected in updates.items():
                values = [
                    line.split("=", 1)[1]
                    for line in text
                    if line.startswith(key + "=")
                ]
                if len(values) != 1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[brain-env-stage] mismatch:{key}")
                if key == "VOYAGE_API_KEY":
                    fp = hashlib.sha256(expected.encode()).hexdigest()[:16]
                    print(f"[brain-env-stage] VOYAGE_API_KEY:fp={fp} len={len(expected)}")
                else:
                    print(f"[brain-env-stage] {key}:match=true")
            print("[brain-env-stage] COMPLETE_OK")
            PY
            fi
            scp -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "$VOYAGE_STAGE_DIR/voyage.env" "root@${PEER_HOST}:/run/linasbot-voyage.env"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "chmod 0600 /run/linasbot-voyage.env; chown root:root /run/linasbot-voyage.env"
            # Peer must NOT call --verify-stage-authority (node01-only identity).
            # Match scripts/ha/whatsapp_phase1_web_chat_apply.sh peer-stage authority.
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "export EXPECTED_RELEASE_SHA='$EXPECTED_RELEASE_SHA' META_HA_STAGE_ONLY=true; set -a; . /run/linasbot-voyage.env; set +a; bash -s" <<'STAGEEOF'
            set -euo pipefail
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import os
            import sys
            from pathlib import Path

            sys.path.insert(0, "/opt/linasbot")
            import scripts.ha.sync_meta_env_to_peer as sync

            expected_sha = os.environ["EXPECTED_RELEASE_SHA"]
            state_root = Path("/var/lib/linasbot/meta-ha")
            sync._refuse_conflicting_ha_transaction(state_root)
            sync._require_node_identity(sync.ENV_PATH, sync.PEER_NODE_ID)
            if sync._load_journal(state_root) is not None:
                raise SystemExit("[brain-env-stage] peer journal present")
            sync._ensure_maintenance_armed(state_root)
            worker_state = sync._load_worker_state(state_root)
            if (
                worker_state is None
                or worker_state["role"] != "peer"
                or worker_state["expected_sha"] != expected_sha
                or worker_state["status"] != "quiesced"
            ):
                raise SystemExit("[brain-env-stage] peer worker state invalid")
            current_fingerprint = sync._meta_fingerprint(
                sync._read_meta_values(sync.ENV_PATH),
                expected_sha,
            )
            if current_fingerprint != worker_state["old_fingerprint"]:
                raise SystemExit("[brain-env-stage] peer env fingerprint drift")
            sync._verify_worker_units_quiesced()
            print("[brain-env-stage] peer_stage_authority_verified=true")
            PY
            if [ -x "$REPO_DIR/scripts/prod_stage_customer_brain_env.sh" ]; then
              # Script re-checks node02 + maintenance; skip nested verify-stage-authority.
              bash "$REPO_DIR/scripts/prod_stage_customer_brain_env.sh"
            else
              "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import hashlib
            import hmac
            import os
            import sys

            sys.path.insert(0, "/opt/linasbot")
            from pathlib import Path
            from scripts.ha.meta_env_file import atomic_update_env

            voyage = os.environ["VOYAGE_API_KEY"].strip()
            if len(voyage) < 20:
                raise SystemExit("[brain-env-stage] voyage length_too_short")
            updates = {
                "VOYAGE_API_KEY": voyage,
                "LINAS_CUSTOMER_AI_LAB": "true",
                "EMERGENCY_LEGACY_REPLY_ENABLED": "false",
                "MESSAGE_BILLING_CUTOVER": "false",
                "MESSAGE_BILLING_ENABLED": "false",
            }
            atomic_update_env(Path("/opt/linasbot/.env"), updates)
            text = open("/opt/linasbot/.env", encoding="utf-8").read().splitlines()
            for key, expected in updates.items():
                values = [
                    line.split("=", 1)[1]
                    for line in text
                    if line.startswith(key + "=")
                ]
                if len(values) != 1 or not hmac.compare_digest(values[0], expected):
                    raise SystemExit(f"[brain-env-stage] mismatch:{key}")
                if key == "VOYAGE_API_KEY":
                    fp = hashlib.sha256(expected.encode()).hexdigest()[:16]
                    print(f"[brain-env-stage] VOYAGE_API_KEY:fp={fp} len={len(expected)}")
                else:
                    print(f"[brain-env-stage] {key}:match=true")
            print("[brain-env-stage] peer COMPLETE_OK")
            PY
            fi
            shred -u /run/linasbot-voyage.env 2>/dev/null || rm -f /run/linasbot-voyage.env
            STAGEEOF
            shred -u "$VOYAGE_STAGE_DIR/voyage.env" 2>/dev/null || rm -f "$VOYAGE_STAGE_DIR/voyage.env"
            rmdir "$VOYAGE_STAGE_DIR" 2>/dev/null || true
            # Non-meta keys: commit via restart only (do NOT start a Meta sync transaction).
            # shellcheck source=/dev/null
            source "$REPO_DIR/scripts/ha/whatsapp_phase1_apply_lib.sh"
            # Re-arm fail-closed after lib source resets MAINTENANCE_ARMED.
            MAINTENANCE_ARMED=true
            ENV_BACKUP="$META_HA_STATE_ROOT/env.before"
            commit_staged_non_meta_env_via_restart "[brain-env-ha]"
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" \
              "$EXPECTED_RELEASE_SHA" cluster-release-only
            "$REPO_DIR/venv/bin/python" -I - <<'PY'
            import hashlib
            import os
            import subprocess
            from pathlib import Path

            key = "VOYAGE_API_KEY"
            expected = None
            for line in Path("/opt/linasbot/.env").read_text(encoding="utf-8").splitlines():
                if line.startswith(key + "="):
                    expected = line.split("=", 1)[1]
                    break
            if not expected:
                raise SystemExit("[brain-env-ha] voyage missing after commit")
            pid = subprocess.check_output(
                ["systemctl", "show", "-p", "MainPID", "--value", "linasbot"], text=True
            ).strip()
            if not pid or pid == "0":
                raise SystemExit("[brain-env-ha] linasbot MainPID unavailable")
            env_map = {}
            for item in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                if b"=" in item:
                    k, v = item.split(b"=", 1)
                    env_map[k.decode()] = v.decode()
            loaded = env_map.get(key, "")
            if not loaded:
                raise SystemExit("[brain-env-ha] process missing VOYAGE_API_KEY")
            exp_fp = hashlib.sha256(expected.encode()).hexdigest()[:16]
            got_fp = hashlib.sha256(loaded.encode()).hexdigest()[:16]
            if exp_fp != got_fp:
                raise SystemExit("[brain-env-ha] process voyage fingerprint mismatch")
            for flag, want in (
                ("LINAS_CUSTOMER_AI_LAB", "true"),
                ("EMERGENCY_LEGACY_REPLY_ENABLED", "false"),
                ("MESSAGE_BILLING_CUTOVER", "false"),
            ):
                if env_map.get(flag) != want:
                    raise SystemExit(f"[brain-env-ha] process flag mismatch:{flag}")
            print(f"[brain-env-ha] process_env_match=true voyage_fp={got_fp}")
            PY
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "$REPO_DIR/venv/bin/python -I -" <<'PEERCHECK'
            import hashlib
            import subprocess
            from pathlib import Path

            key = "VOYAGE_API_KEY"
            expected = None
            for line in Path("/opt/linasbot/.env").read_text(encoding="utf-8").splitlines():
                if line.startswith(key + "="):
                    expected = line.split("=", 1)[1]
                    break
            if not expected:
                raise SystemExit("[brain-env-ha] peer voyage missing after commit")
            pid = subprocess.check_output(
                ["systemctl", "show", "-p", "MainPID", "--value", "linasbot"], text=True
            ).strip()
            if not pid or pid == "0":
                raise SystemExit("[brain-env-ha] peer linasbot MainPID unavailable")
            env_map = {}
            for item in Path(f"/proc/{pid}/environ").read_bytes().split(b"\0"):
                if b"=" in item:
                    k, v = item.split(b"=", 1)
                    env_map[k.decode()] = v.decode()
            loaded = env_map.get(key, "")
            if not loaded:
                raise SystemExit("[brain-env-ha] peer process missing VOYAGE_API_KEY")
            exp_fp = hashlib.sha256(expected.encode()).hexdigest()[:16]
            got_fp = hashlib.sha256(loaded.encode()).hexdigest()[:16]
            if exp_fp != got_fp:
                raise SystemExit("[brain-env-ha] peer process voyage fingerprint mismatch")
            for flag, want in (
                ("LINAS_CUSTOMER_AI_LAB", "true"),
                ("EMERGENCY_LEGACY_REPLY_ENABLED", "false"),
                ("MESSAGE_BILLING_CUTOVER", "false"),
            ):
                if env_map.get(flag) != want:
                    raise SystemExit(f"[brain-env-ha] peer process flag mismatch:{flag}")
            print(f"[brain-env-ha] peer_process_env_match=true voyage_fp={got_fp}")
            PEERCHECK
            TRANSACTION_COMPLETE=true
            MAINTENANCE_ARMED=false
            echo "[brain-env-ha] COMPLETE_OK"
