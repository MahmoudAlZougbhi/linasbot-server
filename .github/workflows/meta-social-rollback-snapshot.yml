name: Meta Social Rollback Snapshot

on:
  workflow_dispatch:

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: Encrypt old Meta production configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create encrypted rollback archive on production
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_ROLLBACK_ENCRYPTION_KEY: ${{ secrets.META_ROLLBACK_ENCRYPTION_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: META_ROLLBACK_ENCRYPTION_KEY
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_snapshot_meta_social_rollback.sh
            sudo -E bash /opt/linasbot/scripts/prod_snapshot_meta_social_rollback.sh
