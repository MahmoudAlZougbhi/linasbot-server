name: Meta Webhook Nginx Setup

on:
  workflow_dispatch:

concurrency:
  group: meta-webhook-nginx-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Set Meta verify token + validate webhook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set production verify token and validate webhook
        uses: appleboy/ssh-action@v1.2.0
        env:
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          envs: META_WEBHOOK_VERIFY_TOKEN
          script: |
            set -e
            test -n "$META_WEBHOOK_VERIFY_TOKEN"
            test -f /opt/linasbot/scripts/prod_set_meta_verify_token.sh
            sudo -E bash /opt/linasbot/scripts/prod_set_meta_verify_token.sh
