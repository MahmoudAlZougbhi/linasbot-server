name: Model Routing Policy Apply

# Apply Sol/Terra model-routing env keys on production (no Meta/token changes).

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_MODEL_ROUTING_POLICY to apply"
        required: true
        type: string

concurrency:
  group: model-routing-policy-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply model routing policy on production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.CONFIRM == 'APPLY_MODEL_ROUTING_POLICY'
    steps:
      - name: Apply model routing via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -e
            cd /opt/linasbot
            git fetch origin main
            if [ ! -f /opt/linasbot/scripts/prod_apply_model_routing_policy.sh ]; then
              git show origin/main:scripts/prod_apply_model_routing_policy.sh > /tmp/prod_apply_model_routing_policy.sh
              sudo install -m 0755 /tmp/prod_apply_model_routing_policy.sh /opt/linasbot/scripts/prod_apply_model_routing_policy.sh
            else
              sudo chmod 0755 /opt/linasbot/scripts/prod_apply_model_routing_policy.sh
            fi
            sudo bash /opt/linasbot/scripts/prod_apply_model_routing_policy.sh
            curl -fsS https://linasaibot.com/api/ready >/tmp/ready.json
            python3 - <<'PY'
            import json
            d=json.load(open("/tmp/ready.json"))
            assert d.get("ok") is True, d
            print("[model-routing] ready ok")
            PY
