name: Meta App A Scope Audit

on:
  workflow_dispatch:

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read-only App A scope audit on production
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit binding scopes on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_DIR=/opt/linasbot
            if [ -f /opt/linasbot/linaslaserbot-2.7.22/main.py ]; then
              APP_DIR=/opt/linasbot/linaslaserbot-2.7.22
            fi
            cd /opt/linasbot
            git fetch origin main fix/ig-fb-comments-capability-gates
            git checkout origin/fix/ig-fb-comments-capability-gates -- \
              scripts/audit_meta_app_a_scopes.py \
              scripts/prod_meta_comment_runtime_probe.py
            set -a
            if [ -f "$APP_DIR/.env" ]; then
              # shellcheck disable=SC1090
              source "$APP_DIR/.env"
            elif [ -f /opt/linasbot/.env ]; then
              # shellcheck disable=SC1091
              source /opt/linasbot/.env
            fi
            set +a
            if [ -f "$APP_DIR/venv/bin/activate" ]; then
              # shellcheck disable=SC1091
              source "$APP_DIR/venv/bin/activate"
            elif [ -f /opt/linasbot/venv/bin/activate ]; then
              # shellcheck disable=SC1091
              source /opt/linasbot/venv/bin/activate
            else
              echo "App venv missing" >&2
              exit 1
            fi
            export PYTHONPATH="$APP_DIR${PYTHONPATH:+:$PYTHONPATH}"
            cd "$APP_DIR"
            python3 /opt/linasbot/scripts/audit_meta_app_a_scopes.py
            python3 /opt/linasbot/scripts/prod_meta_comment_runtime_probe.py
