name: Meta Facebook Permission Group Scope Audit

on:
  workflow_dispatch:

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read-only Facebook permission group audit on production
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit binding scopes on production server
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          envs: EXPECTED_RELEASE_SHA
          script: |
            set -euo pipefail
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            REPO_DIR=/opt/linasbot
            DEPLOYED_RELEASE_SHA="$(git -C "$REPO_DIR" rev-parse HEAD)"
            if [ "$DEPLOYED_RELEASE_SHA" != "$EXPECTED_RELEASE_SHA" ]; then
              echo "[meta-scope-audit] workflow SHA does not match deployed release" >&2
              exit 1
            fi
            if ! git -C "$REPO_DIR" diff --quiet "$DEPLOYED_RELEASE_SHA" -- || \
               ! git -C "$REPO_DIR" diff --cached --quiet "$DEPLOYED_RELEASE_SHA" --; then
              echo "[meta-scope-audit] deployed tracked files differ from release SHA" >&2
              exit 1
            fi
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA"
            APP_DIR=/opt/linasbot
            ENV_FILE="$APP_DIR/.env"
            PYTHON_BIN="$APP_DIR/venv/bin/python"
            test -f "$ENV_FILE"
            test -x "$PYTHON_BIN"
            export PYTHONPATH="$APP_DIR${PYTHONPATH:+:$PYTHONPATH}"
            export META_SCOPE_AUDIT_ENV_FILE="$ENV_FILE"
            export META_SCOPE_AUDIT_REQUIRE_COMMENTS=true
            cd "$APP_DIR"
            "$PYTHON_BIN" "$REPO_DIR/scripts/audit_meta_app_a_scopes.py"
            "$PYTHON_BIN" "$REPO_DIR/scripts/prod_meta_comment_runtime_probe.py"
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$EXPECTED_RELEASE_SHA"
