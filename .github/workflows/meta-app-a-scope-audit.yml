name: Meta App A Scope Audit

on:
  workflow_dispatch:

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read-only App A scope audit on production
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit binding scopes on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_DIR=/opt/linasbot
            if [ -f /opt/linasbot/linaslaserbot-2.7.22/main.py ]; then
              APP_DIR=/opt/linasbot/linaslaserbot-2.7.22
            fi
            cd /opt/linasbot
            git fetch origin main
            git checkout origin/main -- scripts/audit_meta_app_a_scopes.py
            set -a
            # Prefer app-dir env, then repo root env
            if [ -f "$APP_DIR/.env" ]; then
              # shellcheck disable=SC1090
              source "$APP_DIR/.env"
            elif [ -f /opt/linasbot/.env ]; then
              # shellcheck disable=SC1091
              source /opt/linasbot/.env
            fi
            set +a
            PYTHON_BIN=""
            if [ -x "$APP_DIR/venv/bin/python" ]; then
              PYTHON_BIN="$APP_DIR/venv/bin/python"
            elif [ -x "$APP_DIR/venv/bin/python3" ]; then
              PYTHON_BIN="$APP_DIR/venv/bin/python3"
            elif [ -x /opt/linasbot/venv/bin/python ]; then
              PYTHON_BIN=/opt/linasbot/venv/bin/python
            elif [ -x /opt/linasbot/venv/bin/python3 ]; then
              PYTHON_BIN=/opt/linasbot/venv/bin/python3
            fi
            if [ -z "$PYTHON_BIN" ]; then
              echo "App venv python missing" >&2
              exit 1
            fi
            export PYTHONPATH="$APP_DIR${PYTHONPATH:+:$PYTHONPATH}"
            cd "$APP_DIR"
            sudo -E PYTHONPATH="$PYTHONPATH" "$PYTHON_BIN" /opt/linasbot/scripts/audit_meta_app_a_scopes.py \
              || sudo -E PYTHONPATH="$PYTHONPATH" "$PYTHON_BIN" scripts/audit_meta_app_a_scopes.py
            sudo -E PYTHONPATH="$PYTHONPATH" "$PYTHON_BIN" - <<'PY'
from services.channel_capability_state import comment_capability_state, dm_capability_state
from services.entitlements_service import entitlements_store
from services.plan_economics import PLAN_PRICES_USD

ent = entitlements_store.get("linas")
print(f"[scope-audit] entitlement_plan={ent.plan_id} status={ent.status}")
print(f"[scope-audit] catalog_plans={','.join(PLAN_PRICES_USD.keys())}")
for platform in ("facebook", "instagram"):
    st = comment_capability_state("linas", platform)
    print(
        f"[scope-audit] comments platform={platform} "
        f"permission_present={st.get('permission_present')} "
        f"webhook_subscribed={st.get('webhook_subscribed')} "
        f"effective_enabled={st.get('effective_enabled')} "
        f"blocker_code={st.get('blocker_code')} "
        f"missing_scopes={','.join(st.get('missing_scopes') or []) or 'none'} "
        f"advanced={st.get('app_review', {}).get('advanced_access_approved')}"
    )
    dm = dm_capability_state("linas", platform)
    print(
        f"[scope-audit] dm platform={platform} "
        f"permission_present={dm.get('permission_present')} "
        f"effective_enabled={dm.get('effective_enabled')} "
        f"blocker_code={dm.get('blocker_code')}"
    )
print("[scope-audit] capability_probe_done")
PY
