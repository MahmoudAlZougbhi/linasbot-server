name: Meta App A Scope Audit

on:
  workflow_dispatch:

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Read-only App A scope audit on production
    environment: meta-social-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit binding scopes on production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/linasbot
            git fetch origin main
            git checkout origin/main -- scripts/audit_meta_app_a_scopes.py
            set -a
            source /opt/linasbot/.env
            set +a
            PYTHON_BIN="/opt/linasbot/venv/bin/python"
            if [ ! -x "$PYTHON_BIN" ]; then
              PYTHON_BIN="/opt/linasbot/venv/bin/python3"
            fi
            if [ ! -x "$PYTHON_BIN" ]; then
              echo "App venv python missing" >&2
              exit 1
            fi
            sudo -E PYTHONPATH=/opt/linasbot "$PYTHON_BIN" scripts/audit_meta_app_a_scopes.py
