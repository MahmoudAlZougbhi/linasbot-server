name: BLOCKED - Dashboard Auth Secret Apply Requires Two-Node HA

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_DASHBOARD_AUTH_SECRET to acknowledge the blocked operation"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  blocked:
    if: github.event.inputs.CONFIRM == 'APPLY_DASHBOARD_AUTH_SECRET'
    runs-on: ubuntu-latest
    environment: meta-social-cutover
    steps:
      - name: Refuse node01-only environment mutation
        run: |
          echo "BLOCKED: DASHBOARD_AUTH_SECRET needs an exact two-node env backup, sync, restart, worker proof, and rollback transaction." >&2
          exit 1
