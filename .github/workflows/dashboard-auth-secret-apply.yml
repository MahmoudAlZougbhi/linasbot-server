# Apply stable DASHBOARD_AUTH_SECRET + ENVIRONMENT=production on the server.
# Never logs secret values. Does not auto-generate; uses GitHub Actions secret only.
name: Dashboard Auth Secret Apply

on:
  workflow_dispatch:
    inputs:
      CONFIRM:
        description: "Type APPLY_DASHBOARD_AUTH_SECRET to apply"
        required: true
        type: string

concurrency:
  group: dashboard-auth-secret-apply
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    name: Apply DASHBOARD_AUTH_SECRET on production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.CONFIRM == 'APPLY_DASHBOARD_AUTH_SECRET'
    steps:
      - name: Apply dashboard auth secret via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DASHBOARD_AUTH_SECRET: ${{ secrets.DASHBOARD_AUTH_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: DASHBOARD_AUTH_SECRET
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_apply_dashboard_auth.sh
            sudo -E bash /opt/linasbot/scripts/prod_apply_dashboard_auth.sh
