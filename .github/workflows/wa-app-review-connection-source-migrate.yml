# One-shot WhatsApp App Review additive migration (no bind or token changes).
name: WA App Review Connection Source Migrate

on:
  workflow_dispatch:
    inputs:
      PHASE:
        description: "PREFLIGHT_ONLY or MIGRATE_APPLY"
        required: true
        type: choice
        options:
          - PREFLIGHT_ONLY
          - MIGRATE_APPLY
      CONFIRM:
        description: "For MIGRATE_APPLY type APPLY_WA_CONNECTION_SOURCE_MIGRATION"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: Preflight or migrate connection_source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: meta-social-cutover
    steps:
      - name: SSH ops
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          PHASE: ${{ github.event.inputs.PHASE }}
          CONFIRM: ${{ github.event.inputs.CONFIRM }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          envs: EXPECTED_RELEASE_SHA,PHASE,CONFIRM
          script: |
            set -euo pipefail
            REPO_DIR=/opt/linasbot
            sudo -E "$REPO_DIR/venv/bin/python" \
              "$REPO_DIR/scripts/ha/production_mutation_guard.py" run \
              --expected-sha "$EXPECTED_RELEASE_SHA" \
              --script scripts/prod_wa_connection_source_migrate.sh
