name: P12 access preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p12-access-preflight
  cancel-in-progress: false

jobs:
  migrate-logs:
    name: Migrate logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/doctl.tar.gz https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/doctl.tar.gz doctl
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - name: Read migrate failure
        env:
          DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          doctl kubernetes cluster kubeconfig save linas-prod-doks --expiry-seconds 600
          cid="$(doctl kubernetes cluster get linas-prod-doks --format ID --no-header | tr -d '[:space:]')"
          doctl databases list -o json > /tmp/dbs.json
          CLUSTER_ID="$cid" python3 -c 'import json,os,subprocess; rows=json.load(open("/tmp/dbs.json")); cid=os.environ["CLUSTER_ID"]; droplets=("510629908","591901417");
          names=("linas-postgres-prod","linas-redis-prod")
          for row in rows:
            if row.get("name") not in names: continue
            for rule in ["k8s:"+cid]+["droplet:"+d for d in droplets]:
              proc=subprocess.run(["doctl","databases","firewalls","append",row["id"],"--rule",rule], text=True, capture_output=True)
              print(row["name"], rule.split(":")[0], "ok" if proc.returncode==0 else "fail")
            raw=subprocess.run(["doctl","databases","get",row["id"],"-o","json"], text=True, capture_output=True)
            data=json.loads(raw.stdout or "[]")
            item=data[0] if isinstance(data, list) and data else data
            print(row["name"], "status", item.get("status") if isinstance(item, dict) else "unknown", "db_vpc", item.get("private_network_uuid") if isinstance(item, dict) else "unknown")
          '
          kubectl get pods -A
          kubectl -n linas get jobs,pods,events --sort-by=.lastTimestamp || true
          kubectl -n linas logs job/migrate --tail=100 > /tmp/migrate-logs.txt || true
          python3 -c 'import re,pathlib; t=pathlib.Path("/tmp/migrate-logs.txt").read_text(errors="replace"); t=re.sub(r"[a-z]+://[^\\s]+","[redacted-url]",t); print(t[-4000:])'
  preflight:
    name: P12 access preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install tools
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/doctl.tar.gz https://github.com/digitalocean/doctl/releases/download/v1.104.0/doctl-1.104.0-linux-amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/doctl.tar.gz doctl
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.31.1/bin/linux/amd64/kubectl
          install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          pip install --quiet awscli google-auth google-api-python-client PyJWT cryptography
          npm install -g eas-cli@16.17.4
      - name: Run checks
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          LINAS_SPACES_KEY: ${{ secrets.LINAS_SPACES_KEY }}
          LINAS_SPACES_SECRET: ${{ secrets.LINAS_SPACES_SECRET }}
          LINAS_SPACES_BUCKET: ${{ secrets.LINAS_SPACES_BUCKET }}
          LINAS_SPACES_ENDPOINT: ${{ secrets.LINAS_SPACES_ENDPOINT }}
          LINAS_BACKUP_BUCKET: ${{ secrets.LINAS_BACKUP_BUCKET }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          APPLE_IAP_ISSUER_ID: ${{ secrets.APPLE_IAP_ISSUER_ID }}
          APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
          APPLE_IAP_PRIVATE_KEY: ${{ secrets.APPLE_IAP_PRIVATE_KEY }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: python3 scripts/ops/preflight_p12.py
