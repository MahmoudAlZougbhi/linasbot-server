name: WA Cloud Webhook Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wa-cloud-webhook-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: PG + journal final
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 6m
          script: |
            set -euo pipefail
            echo "[wa-probe] start"
            ENV_FILE=/opt/linasbot/.env
            set -a; . "$ENV_FILE"; set +a
            echo "[wa-probe] dsn_scheme=$(python3 - <<'P'
            import os
            from urllib.parse import urlparse
            u=os.environ.get('LINAS_WHATSAPP_DATABASE_URL','')
            print(urlparse(u).scheme or 'empty')
            P
            )"
            echo "[wa-probe] which_psql=$(command -v psql || echo missing)"
            /opt/linasbot/venv/bin/python - <<'PY'
            import os, sys
            from urllib.parse import urlparse
            raw = os.environ.get("LINAS_WHATSAPP_DATABASE_URL") or ""
            if not raw.strip():
                print("[wa-probe] missing LINAS_WHATSAPP_DATABASE_URL")
                sys.exit(1)
            # Normalize SQLAlchemy-style URLs for psycopg
            dsn = raw.replace("postgresql+psycopg2://", "postgresql://").replace("postgresql+psycopg://", "postgresql://")
            scheme = urlparse(dsn).scheme
            print(f"[wa-probe] normalized_scheme={scheme}")
            try:
                import sqlalchemy
                from sqlalchemy import create_engine, text
                eng = create_engine(raw)
                with eng.connect() as c:
                    # Aggregate-only counts — no event_key / payload / phone dumps (PII).
                    n = c.execute(text("""
                        SELECT count(*) FROM whatsapp_webhook_events
                        WHERE created_at >= NOW() - INTERVAL '24 hours'
                    """)).scalar()
                    print(f"[wa-probe] webhook_events_last_24h={int(n or 0)}")
                    n = c.execute(text("""
                        SELECT count(*) FROM whatsapp_connections
                        WHERE lifecycle_status='connected' AND revoked_at IS NULL
                    """)).scalar()
                    print(f"[wa-probe] active_connections_total={int(n or 0)}")
                    n = c.execute(text("""
                        SELECT count(*) FROM whatsapp_messages
                        WHERE created_at >= NOW() - INTERVAL '24 hours'
                    """)).scalar()
                    print(f"[wa-probe] messages_last_24h={int(n or 0)}")
                    n = c.execute(text("""
                        SELECT count(*) FROM whatsapp_outbound_intents
                        WHERE created_at >= NOW() - INTERVAL '24 hours'
                    """)).scalar()
                    print(f"[wa-probe] outbound_last_24h={int(n or 0)}")
                    try:
                        n = c.execute(text("""
                            SELECT count(*) FROM whatsapp_smart_followup_jobs
                            WHERE created_at >= NOW() - INTERVAL '24 hours'
                        """)).scalar()
                        print(f"[wa-probe] sfu_jobs_last_24h={int(n or 0)}")
                    except Exception as e:
                        print(f"[wa-probe] sfu_jobs_last_24h=na:{type(e).__name__}")
                print("[wa-probe] pg_done=true")
            except Exception as e:
                print(f"[wa-probe] pg_fail type={type(e).__name__}")
                sys.exit(1)
            PY
            echo "[wa-probe] SIDE_EFFECTS_SET=$(grep -E '^WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=' /opt/linasbot/.env >/dev/null && echo yes || echo no)"
            echo "[wa-probe] SUCCESS"
