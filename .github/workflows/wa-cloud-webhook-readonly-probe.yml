# Read-only WhatsApp Cloud webhook evidence probe.
name: WA Cloud Webhook Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wa-cloud-webhook-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only WA webhook evidence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 8m
          script: |
            set -euo pipefail
            echo "[wa-probe] host=$(hostname)"
            echo "[wa-probe] utc_now=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "[wa-probe] local_now=$(date +%Y-%m-%dT%H:%M:%S%z)"
            echo -n "[wa-probe] linasbot_active="; systemctl is-active linasbot || true
            systemctl show linasbot -p ActiveEnterTimestamp --no-pager || true

            ENV_FILE=""
            APP_DIR=/opt/linasbot
            if [ -f /opt/linasbot/linaslaserbot-2.7.22/main.py ]; then APP_DIR=/opt/linasbot/linaslaserbot-2.7.22; fi
            if [ -f "$APP_DIR/.env" ]; then ENV_FILE="$APP_DIR/.env"; elif [ -f /opt/linasbot/.env ]; then ENV_FILE=/opt/linasbot/.env; fi
            echo "[wa-probe] app_dir=$APP_DIR"
            if [ -n "$ENV_FILE" ]; then
              val=$(grep -E '^WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=' "$ENV_FILE" | tail -n1 | cut -d= -f2- | tr -d '\r' | tr '[:upper:]' '[:lower:]' || true)
              case "$val" in
                1|true|yes|on) echo "[wa-probe] WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=true" ;;
                0|false|no|off|"") echo "[wa-probe] WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=false_or_empty" ;;
                *) echo "[wa-probe] WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=present_other" ;;
              esac
            fi

            echo "[wa-probe] === journal since 22:30 local / 19:30 UTC ==="
            journalctl -u linasbot --since "2026-08-11 19:30:00 UTC" --no-pager -o short-iso 2>/dev/null \
              | grep -E 'whatsapp_cloud|whatsapp-cloud|WhatsApp webhook|WEBHOOK_VERIFIED|signature_|unknown_asset|webhook_side_effects|POST /webhook|Invalid signature|app_a_unavailable' \
              | sed -E 's/(sha256=)[A-Fa-f0-9]+/\1[REDACTED]/g' \
              | tail -100 || echo "[wa-probe] no_special_matches=true"

            echo "[wa-probe] === raw journal lines 19:44:50-19:45:20 UTC (redacted query) ==="
            journalctl -u linasbot --since "2026-08-11 19:44:50 UTC" --until "2026-08-11 19:45:20 UTC" --no-pager -o short-iso 2>/dev/null \
              | sed -E 's/\?[^ ]+/?[REDACTED]/g; s/(sha256=)[A-Fa-f0-9]+/\1[REDACTED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              | tail -80 || echo "[wa-probe] empty_second_window=true"

            echo "[wa-probe] === counts today ==="
            for pat in 'whatsapp_cloud' 'whatsapp-cloud' 'WhatsApp webhook POST' 'unknown_asset' 'signature_rejection' '123456123' 'WEBHOOK_VERIFIED'; do
              c=$(journalctl -u linasbot --since "2026-08-11 00:00:00 UTC" --no-pager -o cat 2>/dev/null | grep -c "$pat" || true)
              echo "[wa-probe] count pat=$pat value=$c"
            done

            echo "[wa-probe] === route presence on disk ==="
            if grep -n 'webhook/whatsapp-cloud' "$APP_DIR/modules/whatsapp_cloud_webhook.py" >/dev/null 2>&1; then
              echo "[wa-probe] route_file_contains_whatsapp_cloud=true"
            else
              echo "[wa-probe] route_file_contains_whatsapp_cloud=false"
            fi
            echo -n "[wa-probe] deployed_sha="; git -C /opt/linasbot rev-parse --short HEAD 2>/dev/null || true

            echo "[wa-probe] === local challenge shape check (no secrets) ==="
            # Wrong token => expect 403; proves route is mounted. Does not print tokens.
            code=$(curl -s -o /tmp/wa_chal.txt -w '%{http_code}' "http://127.0.0.1:8003/webhook/whatsapp-cloud?hub.mode=subscribe&hub.verify_token=wrong-token-probe&hub.challenge=12345" || true)
            echo "[wa-probe] local_get_wrong_token_http=$code"
            code2=$(curl -s -o /tmp/wa_post.txt -w '%{http_code}' -X POST "http://127.0.0.1:8003/webhook/whatsapp-cloud" -H 'Content-Type: application/json' -H 'X-Hub-Signature-256: sha256=deadbeef' --data '{"object":"whatsapp_business_account"}' || true)
            echo "[wa-probe] local_post_badsig_http=$code2"

            echo "[wa-probe] === PostgreSQL via psql ==="
            if [ -z "$ENV_FILE" ]; then
              echo "[wa-probe] skip_pg=no_env"
            else
              set -a
              # shellcheck disable=SC1090
              . "$ENV_FILE"
              set +a
              if [ -z "${LINAS_WHATSAPP_DATABASE_URL:-}" ]; then
                echo "[wa-probe] LINAS_WHATSAPP_DATABASE_URL=unset"
              else
                echo "[wa-probe] LINAS_WHATSAPP_DATABASE_URL=present"
                # Never echo DSN. Use psql ON_ERROR_STOP.
                psql "$LINAS_WHATSAPP_DATABASE_URL" -v ON_ERROR_STOP=1 -At -F '|' -c \
                  "SELECT id::text, event_kind, processing_state, attempt_count::text, created_at::text, processed_at::text, (tenant_id IS NOT NULL)::text, (connection_id IS NOT NULL)::text, left(event_key,48), left(coalesce(payload_hash,''),12) FROM whatsapp_webhook_events WHERE created_at >= TIMESTAMPTZ '2026-08-11 00:00:00+00' AND created_at <= TIMESTAMPTZ '2026-08-12 00:00:00+00' ORDER BY created_at DESC LIMIT 50;" \
                  | while IFS= read -r line; do echo "[wa-probe] event_row=$line"; done || echo "[wa-probe] psql_events_failed=true"
                echo -n "[wa-probe] events_today_count="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_webhook_events WHERE created_at >= TIMESTAMPTZ '2026-08-11 00:00:00+00' AND created_at < TIMESTAMPTZ '2026-08-12 00:00:00+00';" || echo err
                echo -n "[wa-probe] events_test_window_count="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_webhook_events WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:40:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 19:55:00+00';" || echo err
                echo -n "[wa-probe] active_conn_sample_phone="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_connections WHERE phone_number_id='123456123' AND lifecycle_status='connected' AND revoked_at IS NULL;" || echo err
                echo -n "[wa-probe] active_connections_total="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_connections WHERE lifecycle_status='connected' AND revoked_at IS NULL;" || echo err
                echo -n "[wa-probe] messages_test_window="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_messages WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00';" || echo err
                echo -n "[wa-probe] outbound_test_window="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_outbound_intents WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00';" || echo err
                echo -n "[wa-probe] sfu_jobs_test_window="; psql "$LINAS_WHATSAPP_DATABASE_URL" -At -c "SELECT count(*) FROM whatsapp_smart_followup_jobs WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00';" 2>/dev/null || echo na
              fi
            fi
            echo "[wa-probe] SUCCESS"
