name: WA Cloud Webhook Readonly Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wa-cloud-webhook-readonly-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: PG + journal final
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 6m
          script: |
            set -euo pipefail
            echo "[wa-probe] start"
            ENV_FILE=/opt/linasbot/.env
            set -a; . "$ENV_FILE"; set +a
            echo "[wa-probe] dsn_scheme=$(python3 - <<'P'
            import os
            from urllib.parse import urlparse
            u=os.environ.get('LINAS_WHATSAPP_DATABASE_URL','')
            print(urlparse(u).scheme or 'empty')
            P
            )"
            echo "[wa-probe] which_psql=$(command -v psql || echo missing)"
            /opt/linasbot/venv/bin/python - <<'PY'
            import os, re, sys
            from urllib.parse import urlparse, urlunparse
            raw = os.environ["LINAS_WHATSAPP_DATABASE_URL"]
            # Normalize SQLAlchemy-style URLs for psycopg
            dsn = raw.replace("postgresql+psycopg2://", "postgresql://").replace("postgresql+psycopg://", "postgresql://")
            scheme = urlparse(dsn).scheme
            print(f"[wa-probe] normalized_scheme={scheme}")
            try:
                import psycopg
                conn = psycopg.connect(dsn)
            except Exception as e1:
                print(f"[wa-probe] psycopg_fail={type(e1).__name__}")
                try:
                    import sqlalchemy
                    from sqlalchemy import create_engine, text
                    eng = create_engine(raw)
                    with eng.connect() as c:
                        rows = c.execute(text("""
                            SELECT id::text, event_kind, processing_state, attempt_count,
                                   created_at, processed_at,
                                   (tenant_id IS NOT NULL), (connection_id IS NOT NULL),
                                   left(event_key,48), left(coalesce(payload_hash,''),12)
                            FROM whatsapp_webhook_events
                            WHERE created_at >= TIMESTAMPTZ '2026-08-11 00:00:00+00'
                              AND created_at < TIMESTAMPTZ '2026-08-12 00:00:00+00'
                            ORDER BY created_at DESC LIMIT 50
                        """)).fetchall()
                        print(f"[wa-probe] webhook_events_today={len(rows)}")
                        for r in rows:
                            prefix=re.sub(r"(\\d{7,})", "[DIGITS]", r[8] or "")
                            print("[wa-probe] event", {
                                "id": (r[0][:8]+"…") if r[0] else None,
                                "event_kind": r[1],
                                "processing_state": r[2],
                                "attempt_count": int(r[3] or 0),
                                "created_at": r[4].isoformat() if r[4] else None,
                                "processed_at": r[5].isoformat() if r[5] else None,
                                "has_tenant": bool(r[6]),
                                "has_connection": bool(r[7]),
                                "event_key_prefix": prefix,
                                "payload_hash_prefix": r[9],
                            })
                        n = c.execute(text("SELECT count(*) FROM whatsapp_webhook_events WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:40:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 19:55:00+00'")).scalar()
                        print(f"[wa-probe] events_test_window_count={n}")
                        n = c.execute(text("SELECT count(*) FROM whatsapp_connections WHERE phone_number_id='123456123' AND lifecycle_status='connected' AND revoked_at IS NULL")).scalar()
                        print(f"[wa-probe] active_conn_sample_phone={n}")
                        n = c.execute(text("SELECT count(*) FROM whatsapp_connections WHERE lifecycle_status='connected' AND revoked_at IS NULL")).scalar()
                        print(f"[wa-probe] active_connections_total={n}")
                        n = c.execute(text("SELECT count(*) FROM whatsapp_messages WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00'")).scalar()
                        print(f"[wa-probe] messages_test_window={n}")
                        n = c.execute(text("SELECT count(*) FROM whatsapp_outbound_intents WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00'")).scalar()
                        print(f"[wa-probe] outbound_test_window={n}")
                        try:
                            n = c.execute(text("SELECT count(*) FROM whatsapp_smart_followup_jobs WHERE created_at >= TIMESTAMPTZ '2026-08-11 19:30:00+00' AND created_at <= TIMESTAMPTZ '2026-08-11 20:15:00+00'")).scalar()
                            print(f"[wa-probe] sfu_jobs_test_window={n}")
                        except Exception as e:
                            print(f"[wa-probe] sfu_jobs_test_window=na:{type(e).__name__}")
                    print("[wa-probe] pg_done=true")
                    sys.exit(0)
                except Exception as e2:
                    print(f"[wa-probe] sqlalchemy_fail={type(e2).__name__}:{e2}")
                    sys.exit(0)
            else:
                print("[wa-probe] unexpected_psycopg_ok")
            PY
            echo "[wa-probe] SIDE_EFFECTS=$(grep -E '^WHATSAPP_CLOUD_WEBHOOK_SIDE_EFFECTS_ENABLED=' /opt/linasbot/.env | cut -d= -f2- | tr -d '\\r')"
            echo "[wa-probe] SUCCESS"
