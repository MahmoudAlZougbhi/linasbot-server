name: Container image

on:
  pull_request:
  push:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --platform linux/amd64 -t linasbot-server:ci .
      - name: Read-only root starts
        run: docker run --rm --read-only --tmpfs /tmp linasbot-server:ci python scripts/container_boot_check.py
      - name: Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: linasbot-server:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
