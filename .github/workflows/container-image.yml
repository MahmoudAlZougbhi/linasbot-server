name: Container image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build
        run: docker build --platform linux/amd64 -t linasbot-server:ci .
      - name: Read-only root starts
        run: docker run --rm --read-only --tmpfs /tmp linasbot-server:ci python scripts/container_boot_check.py
      - name: Scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity CRITICAL --exit-code 1 --ignore-unfixed linasbot-server:ci
      - name: SBOM
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/syft.tar.gz https://github.com/anchore/syft/releases/download/v1.18.1/syft_1.18.1_linux_amd64.tar.gz
          tar -C /usr/local/bin -xzf /tmp/syft.tar.gz syft
          syft linasbot-server:ci -o spdx-json=sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Push by digest
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag linasbot-server:ci "ghcr.io/mahmoudalzougbhi/linasbot-server:${{ github.sha }}"
          docker push "ghcr.io/mahmoudalzougbhi/linasbot-server:${{ github.sha }}"
          docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/mahmoudalzougbhi/linasbot-server:${{ github.sha }}"
          gh api --method PATCH "/user/packages/container/linasbot-server" -f visibility=public || true
          echo "image_pull=public_ghcr"
