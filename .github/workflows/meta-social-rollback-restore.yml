name: RETIRED - Meta Social Rollback Restore

on:
  workflow_dispatch:
    inputs:
      restore_confirmation:
        description: "Type RESTORE_RETIRED_META_APP after the new app is unsubscribed"
        required: true
        type: string
      archive:
        description: "Encrypted archive basename, or LATEST"
        required: true
        default: "LATEST"
        type: string
concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retired:
    name: Block retired-app restoration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: meta-social-cutover
    steps:
      - name: Refuse restoration of the retired Meta app
        run: |
          echo "::error::Retired-app restoration is disabled; repair or roll back the current App A release instead."
          exit 1
