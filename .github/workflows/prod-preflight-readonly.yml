# Read-only production preflight. Does not deploy, rotate, or write secrets.
name: Prod Preflight Readonly

on:
  workflow_dispatch:
    inputs:
      include_meta_runtime_diagnostics:
        description: "Include redacted aggregate Meta social runtime diagnostics"
        required: false
        default: false
        type: boolean

concurrency:
  group: prod-preflight-readonly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only production preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run on-server read-only preflight
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            test -f /opt/linasbot/scripts/prod_preflight_readonly.sh
            sudo bash /opt/linasbot/scripts/prod_preflight_readonly.sh

      - name: Collect redacted Meta social runtime diagnostics
        if: ${{ inputs.include_meta_runtime_diagnostics }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # script_stop rewrites each shell line and corrupts the Python heredoc.
          # The script itself uses `set -e`, so failures still terminate the step.
          script_stop: false
          command_timeout: 5m
          script: |
            set -e
            sudo python3 - <<'PY'
            from __future__ import annotations

            from collections import Counter
            from pathlib import Path
            import glob
            import re
            import subprocess


            completed = subprocess.run(
                [
                    "journalctl",
                    "-u",
                    "linasbot",
                    "--since",
                    "45 minutes ago",
                    "--no-pager",
                    "-o",
                    "cat",
                ],
                check=False,
                capture_output=True,
                text=True,
            )
            journal_lines = completed.stdout.splitlines()
            service_state = subprocess.run(
                [
                    "systemctl",
                    "show",
                    "linasbot",
                    "-p",
                    "MainPID",
                    "-p",
                    "StandardOutput",
                    "-p",
                    "StandardError",
                    "--no-pager",
                ],
                check=False,
                capture_output=True,
                text=True,
            )
            for state_line in service_state.stdout.splitlines():
                key, _, value = state_line.partition("=")
                if key in {"MainPID", "StandardOutput", "StandardError"}:
                    safe_value = re.sub(r"\d{7,}", "[REDACTED_ID]", value)
                    print(f"[meta-runtime] service_{key.lower()}={safe_value}")

            candidate_patterns = (
                "/var/log/linasbot*",
                "/var/log/linasbot/*",
                "/opt/linasbot/logs/*",
                "/opt/linasbot/*.log",
                "/opt/linasbot/linaslaserbot-2.7.22/*.log",
                "/var/log/nginx/access.log",
                "/var/log/nginx/error.log",
            )
            candidate_paths = []
            for pattern in candidate_patterns:
                for raw_path in glob.glob(pattern):
                    path = Path(raw_path)
                    if path.is_file() and path not in candidate_paths:
                        candidate_paths.append(path)

            file_lines = []
            source_names = []
            for path in candidate_paths:
                try:
                    with path.open("rb") as handle:
                        handle.seek(0, 2)
                        size = handle.tell()
                        handle.seek(max(0, size - 2_000_000))
                        chunk = handle.read().decode("utf-8", "replace")
                except OSError:
                    continue
                source_names.append(path.name)
                file_lines.extend(chunk.splitlines())
            lines = journal_lines + file_lines
            patterns = {
                "meta_background_failure": r"\[meta-social\] background processing failed",
                "meta_state_restore_skipped": r"\[meta-social\] state restore skipped",
                "delayed_processing_error": r"\[_delayed_process_messages\] ERROR",
                "pending_queue_empty": r"pending message queue empty",
                "ai_turn_claim_ok": r"\[ai-turn\].*claim=OK",
                "ai_turn_duplicate_skip": r"\[ai-turn\].*claim=DUPLICATE_SKIP",
                "text_turn_stale_skip": r"\[text-turn\].*STALE_SKIP",
                "meta_send_http_4xx": r"Meta Send API returned HTTP 4\d\d",
                "meta_send_http_5xx": r"Meta Send API returned HTTP 5\d\d",
                "traceback": r"Traceback \(most recent call last\)",
            }
            counts = Counter(
                name
                for line in lines
                for name, pattern in patterns.items()
                if re.search(pattern, line, re.IGNORECASE)
            )
            print(f"[meta-runtime] journal_exit_code={completed.returncode}")
            print(f"[meta-runtime] journal_lines_45m={len(journal_lines)}")
            print(f"[meta-runtime] candidate_log_files={len(source_names)}")
            print(f"[meta-runtime] candidate_log_basenames={sorted(set(source_names))}")
            print(f"[meta-runtime] scanned_log_lines={len(lines)}")
            for name in sorted(patterns):
                print(f"[meta-runtime] {name}={counts[name]}")

            webhook_access = []
            for line in lines:
                match = re.search(
                    r"\[([^\]]+)\].*\"POST /webhook/meta-messaging(?:\?[^ ]*)? HTTP/[^\"]+\"\s+(\d{3})",
                    line,
                )
                if match:
                    webhook_access.append((match.group(1), match.group(2)))
            print(f"[meta-runtime] webhook_access_events={len(webhook_access)}")
            for timestamp, status in webhook_access[-12:]:
                print(f"[meta-runtime] webhook_access=timestamp:{timestamp} status:{status}")

            sensitive = re.compile(
                r"(?:EAA[A-Za-z0-9_-]+|Bearer\s+\S+|"
                r"(?:access_token|app_secret|verify_token|hub\.verify_token)=[^&\s]+)",
                re.IGNORECASE,
            )
            identifiers = re.compile(r"(?<![A-Za-z0-9])\d{7,}(?![A-Za-z0-9])")
            long_values = re.compile(r"(?<![A-Za-z0-9])[A-Za-z0-9_-]{24,}(?![A-Za-z0-9])")
            error_lines = [
                line
                for line in lines
                if re.search(
                    r"\[meta-social\]|\[_delayed_process_messages\] ERROR|"
                    r"Meta Send API returned HTTP|Traceback|pending message queue empty",
                    line,
                    re.IGNORECASE,
                )
            ]
            print(f"[meta-runtime] selected_diagnostic_lines={len(error_lines)}")
            for line in error_lines[-12:]:
                safe = sensitive.sub("[REDACTED_SECRET]", line)
                safe = identifiers.sub("[REDACTED_ID]", safe)
                safe = long_values.sub("[REDACTED_VALUE]", safe)
                safe = safe.replace("\r", " ").replace("\n", " ")[:320]
                print(f"[meta-runtime] diagnostic={safe}")
            PY
