name: RETIRED - Meta Social Atomic Cutover

on:
  workflow_dispatch:
    inputs:
      cutover_confirmation:
        description: "Type CUTOVER_VERIFIED_META_APP"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retired:
    name: Block retired-app cutover
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: meta-social-cutover
    steps:
      - name: Refuse the obsolete retired-app state machine
        run: |
          echo "::error::This retired-app cutover is intentionally disabled. Use the current App A recovery runbook."
          exit 1
