# One-incident orphan-maintenance recovery for failed run 32527312818.
# Clears already-orphaned markers only. Does not sync, apply, finalize, or mutate env.
name: Meta Orphan Maintenance Recovery
on:
  workflow_dispatch:
    inputs:
      BASELINE_SHA:
        description: "Must equal a2ba8d63265504ded18b6d4bd70219628c4d8533"
        required: true
        type: string
      EXPECTED_OLD_CONFIG_ID:
        description: "Must equal 1369663304545819"
        required: true
        type: string
      FAILED_RUN_ID:
        description: "Must equal 32527312818"
        required: true
        type: string
      CONTROL_SHA:
        description: "Must equal this workflow run github.sha"
        required: true
        type: string
      CONFIRM:
        description: "Type RECOVER_ORPHAN_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    name: Recover orphan maintenance markers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: meta-social-cutover
    steps:
      - name: Reject mismatched recovery inputs
        env:
          BASELINE_SHA: ${{ github.event.inputs.BASELINE_SHA }}
          EXPECTED_OLD_CONFIG_ID: ${{ github.event.inputs.EXPECTED_OLD_CONFIG_ID }}
          FAILED_RUN_ID: ${{ github.event.inputs.FAILED_RUN_ID }}
          CONTROL_SHA: ${{ github.event.inputs.CONTROL_SHA }}
          CONFIRM: ${{ github.event.inputs.CONFIRM }}
          REQUIRED_CONTROL_SHA: ${{ github.sha }}
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_VALUE" = "refs/heads/main"
          test "$BASELINE_SHA" = "a2ba8d63265504ded18b6d4bd70219628c4d8533"
          test "$EXPECTED_OLD_CONFIG_ID" = "1369663304545819"
          test "$FAILED_RUN_ID" = "32527312818"
          test "$CONTROL_SHA" = "$REQUIRED_CONTROL_SHA"
          test "$CONFIRM" = "RECOVER_ORPHAN_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533"

      - name: Recover orphaned HA maintenance markers
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.inputs.BASELINE_SHA }}
          BASELINE_SHA: ${{ github.event.inputs.BASELINE_SHA }}
          EXPECTED_OLD_CONFIG_ID: ${{ github.event.inputs.EXPECTED_OLD_CONFIG_ID }}
          FAILED_RUN_ID: ${{ github.event.inputs.FAILED_RUN_ID }}
          CONTROL_SHA: ${{ github.event.inputs.CONTROL_SHA }}
          REQUIRED_CONTROL_SHA: ${{ github.sha }}
          CONFIRM: ${{ github.event.inputs.CONFIRM }}
          META_OAUTH_REDIRECT_URI: https://www.linasaibot.com/oauth/meta/callback
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 18m
          envs: EXPECTED_RELEASE_SHA,BASELINE_SHA,EXPECTED_OLD_CONFIG_ID,FAILED_RUN_ID,CONTROL_SHA,REQUIRED_CONTROL_SHA,CONFIRM,META_OAUTH_REDIRECT_URI
          script: |
            set -euo pipefail
            REQUIRED_SHA=a2ba8d63265504ded18b6d4bd70219628c4d8533
            REQUIRED_OLD_ID=1369663304545819
            REQUIRED_RUN_ID=32527312818
            REQUIRED_CONFIRM=RECOVER_ORPHAN_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533
            REQUIRED_REDIRECT=https://www.linasaibot.com/oauth/meta/callback
            FAILED_RUN_START=1787346694
            MARKER_PROVENANCE=1787350550
            PHASE_SCHEMA=linas-orphan-maintenance-recovery-v1
            test "$BASELINE_SHA" = "$REQUIRED_SHA"
            test "$EXPECTED_RELEASE_SHA" = "$REQUIRED_SHA"
            test "$EXPECTED_OLD_CONFIG_ID" = "$REQUIRED_OLD_ID"
            test "$FAILED_RUN_ID" = "$REQUIRED_RUN_ID"
            test "$CONTROL_SHA" = "$REQUIRED_CONTROL_SHA"
            test "$CONFIRM" = "$REQUIRED_CONFIRM"
            test "$META_OAUTH_REDIRECT_URI" = "$REQUIRED_REDIRECT"
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            PY="$REPO_DIR/venv/bin/python"
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            VOL=/run/linasbot-maintenance
            STATE=/var/lib/linasbot/meta-ha
            PER="$STATE/maintenance"
            PHASE_FILE="$STATE/orphan-maintenance-recovery.phase"
            PUB=https://www.linasaibot.com/api/ready
            H=http://127.0.0.1:8003/api/health
            R=http://127.0.0.1:8003/api/ready
            CONFLICTS="bootstrap.active bootstrap.coordinator.json deploy.active deploy-node.active controlled-failover.active registry-nfs-retire.active python-runtime-provision.active python-runtime-provision.coordinator.json rekey/runtime.guard"
            SYNCS="transaction.json env.before workers.before.json prestage.authority.json"
            DROPINS="90-meta-ha-maintenance.conf 92-meta-controlled-failover.conf 95-linasbot-credential-rekey-guard.conf"
            QUEUES="high_priority interactive background expensive"
            RECOVERY_COMPLETE=false
            PHASE=""
            HELPER=$(cat <<'PY'
            import hashlib, hmac, json, os, stat, subprocess, sys, urllib.error, urllib.request
            from dotenv import dotenv_values
            cmd, *args = sys.argv[1:]
            def fsync_dir(path):
                fd = os.open(path, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
                try:
                    os.fsync(fd)
                finally:
                    os.close(fd)
            def require_secure(path, empty=False):
                st = os.lstat(path)
                if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_gid != 0 or stat.S_IMODE(st.st_mode) != 0o600 or st.st_nlink != 1 or (empty and st.st_size != 0):
                    raise SystemExit("path security contract is invalid")
                fd = os.open(path, os.O_RDWR | getattr(os, "O_NOFOLLOW", 0))
                try:
                    opened = os.fstat(fd)
                    if (st.st_dev, st.st_ino) != (opened.st_dev, opened.st_ino) or not stat.S_ISREG(opened.st_mode) or opened.st_uid != 0 or opened.st_gid != 0 or stat.S_IMODE(opened.st_mode) != 0o600 or opened.st_nlink != 1 or (empty and opened.st_size != 0):
                        raise SystemExit("path security contract is invalid")
                    return fd
                except Exception:
                    os.close(fd)
                    raise
            def durable_empty(path):
                parent = os.path.dirname(path)
                if os.path.lexists(path):
                    fd = require_secure(path, empty=True)
                    try:
                        os.ftruncate(fd, 0)
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                else:
                    os.makedirs(parent, mode=0o700, exist_ok=True)
                    fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0), 0o600)
                    try:
                        os.fchmod(fd, 0o600)
                        os.fchown(fd, 0, 0)
                        os.fsync(fd)
                    finally:
                        os.close(fd)
                fsync_dir(parent)
            def durable_unlink(path, empty=True):
                fd = require_secure(path, empty=empty)
                os.close(fd)
                os.unlink(path)
                fsync_dir(os.path.dirname(path))
            def probe(url, expected, mode):
                req = urllib.request.Request(url, headers={"User-Agent": "orphan-maint-recover/1"})
                try:
                    with urllib.request.urlopen(req, timeout=8) as resp:
                        status, body = int(resp.status), json.loads(resp.read().decode("utf-8"))
                except urllib.error.HTTPError as exc:
                    status, body = int(exc.code), json.loads(exc.read().decode("utf-8"))
                if status != int(expected) or not isinstance(body, dict):
                    raise SystemExit("probe status or JSON is invalid")
                if mode == "live":
                    if body.get("ok") is not True or body.get("role") != "liveness":
                        raise SystemExit("liveness JSON is invalid")
                    return
                checks = body.get("checks") if isinstance(body.get("checks"), dict) else {}
                if body.get("role") != "readiness":
                    raise SystemExit("readiness JSON is invalid")
                if mode == "ready-ok":
                    if body.get("ok") is not True:
                        raise SystemExit("readiness is not healthy")
                    if any(not isinstance(v, dict) or v.get("ok") is not True for v in checks.values()):
                        raise SystemExit("readiness check is not healthy")
                    return
                maint = checks.get("maintenance")
                if body.get("ok") is not False or not isinstance(maint, dict) or maint.get("ok") is not False:
                    raise SystemExit("maintenance is not the failing readiness check")
                for name, value in checks.items():
                    if name != "maintenance" and (not isinstance(value, dict) or value.get("ok") is not True):
                        raise SystemExit("non-maintenance readiness check is not healthy")
            def config_hmac(env_path, old_id, redirect, sha):
                values = dotenv_values(env_path, interpolate=False)
                if str(values.get("META_APP_A_FACEBOOK_LOGIN_CONFIG_ID") or "") != old_id:
                    raise SystemExit("login config or redirect is not the exact old Meta state")
                if str(values.get("META_OAUTH_REDIRECT_URI") or "") != redirect:
                    raise SystemExit("login config or redirect is not the exact old Meta state")
                meta = {k: v for k, v in values.items() if k and k.startswith("META_") and k != "META_DELETION_NODE_ID" and v is not None}
                print(hmac.new(sha.encode("ascii"), json.dumps(meta, separators=(",", ":"), sort_keys=True).encode(), hashlib.sha256).hexdigest())
            def process_meta(env_path):
                values = dotenv_values(env_path, interpolate=False)
                expected = {k: str(v) for k, v in values.items() if k and k.startswith("META_") and v is not None}
                units = ["linasbot.service"] + [f"linasbot-worker@{q}.service" for q in ("high_priority", "interactive", "background", "expensive")]
                for unit in units:
                    pid = subprocess.check_output(["systemctl", "show", "-p", "MainPID", "--value", unit], text=True).strip()
                    if not pid.isdigit() or int(pid) <= 1:
                        raise SystemExit("live unit MainPID is invalid")
                    env = {}
                    for item in open(f"/proc/{pid}/environ", "rb").read().split(b"\0"):
                        if item and b"=" in item:
                            k, v = item.split(b"=", 1)
                            env[k.decode("ascii")] = v.decode("utf-8")
                    live = {k: v for k, v in env.items() if k.startswith("META_")}
                    if live != expected:
                        raise SystemExit("live process Meta environment does not match .env")
            if cmd == "empty":
                durable_empty(args[0])
            elif cmd == "unlink":
                durable_unlink(args[0], empty=True)
            elif cmd == "probe":
                probe(*args)
            elif cmd == "hmac":
                config_hmac(*args)
            elif cmd == "process":
                process_meta(*args)
            elif cmd == "marker":
                path, mode, start, provenance, drain, now = args
                st = os.lstat(path)
                if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_gid != 0 or stat.S_IMODE(st.st_mode) != 0o600 or st.st_nlink != 1 or st.st_size != 0:
                    raise SystemExit("marker security contract is invalid")
                if int(st.st_mtime) < int(start) or (mode != "recent" and int(now) - int(st.st_mtime) < int(drain)):
                    raise SystemExit("marker drain contract is invalid")
                if mode == "exact" and (int(st.st_mtime) != int(provenance) or int(st.st_ctime) != int(provenance)):
                    raise SystemExit("marker provenance is invalid")
            elif cmd == "node":
                if str(dotenv_values(args[0], interpolate=False).get("META_DELETION_NODE_ID") or "") != args[1]:
                    raise SystemExit("HA node id is not the expected node")
            elif cmd == "drain":
                value = int(str(dotenv_values(args[0], interpolate=False).get("META_HA_LB_DRAIN_SECONDS") or ""))
                if not 30 <= value <= 300:
                    raise SystemExit("invalid HA drain interval")
                print(value)
            elif cmd == "dropins":
                h92, h93, h95 = "ccd1d423d6624d28fc7f8984f8fb13824ece04af5a140e770d2c2ffd67b537e9", "25c89c8dc130caacd7b8e1861b07c6c829444a860bca8d298e560133380aff07", "b47ed84bb59ce2569c5fd4b936faa2d3fddf0fb408492b1d60ba820a463f3278"
                def absent(p):
                    if os.path.lexists(p): raise SystemExit("unexpected path present: " + p)
                def hashed(p, digest):
                    st = os.lstat(p)
                    if stat.S_ISLNK(st.st_mode) or not stat.S_ISREG(st.st_mode) or st.st_uid != 0 or st.st_gid != 0 or stat.S_IMODE(st.st_mode) != 0o644 or st.st_nlink != 1:
                        raise SystemExit("drop-in security contract is invalid")
                    fd = os.open(p, os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
                    try:
                        op = os.fstat(fd)
                        if (st.st_dev, st.st_ino) != (op.st_dev, op.st_ino) or st.st_size != op.st_size or hashlib.sha256(os.read(fd, op.st_size)).hexdigest() != digest:
                            raise SystemExit("drop-in digest or identity is invalid")
                    finally:
                        os.close(fd)
                for p in ("/etc/systemd/system/linasbot.service.d", "/etc/systemd/system/linasbot-worker@.service.d"):
                    absent(p + "/90-meta-ha-maintenance.conf")
                    hashed(p + "/92-meta-controlled-failover.conf", h92); hashed(p + "/93-cpython-pycache-prefix.conf", h93); hashed(p + "/95-linasbot-credential-rekey-guard.conf", h95)
                for q in ("high_priority", "interactive", "background", "expensive"):
                    for n in ("90-meta-ha-maintenance.conf", "92-meta-controlled-failover.conf", "93-cpython-pycache-prefix.conf", "95-linasbot-credential-rekey-guard.conf"):
                        absent(f"/etc/systemd/system/linasbot-worker@{q}.service.d/{n}")
            elif cmd == "write-phase":
                path, schema, baseline, run_id, control, phase = args
                payload = f"schema={schema}\nbaseline={baseline}\nfailed_run={run_id}\ncontrol_sha={control}\nphase={phase}\n".encode()
                parent = os.path.dirname(path)
                os.makedirs(parent, mode=0o700, exist_ok=True)
                tmp = path + ".tmp"
                if os.path.lexists(tmp):
                    fd = require_secure(tmp, empty=False)
                    os.close(fd)
                    os.unlink(tmp)
                    fsync_dir(parent)
                fd = os.open(tmp, os.O_WRONLY | os.O_CREAT | os.O_EXCL | getattr(os, "O_NOFOLLOW", 0), 0o600)
                try:
                    os.fchmod(fd, 0o600)
                    os.fchown(fd, 0, 0)
                    os.write(fd, payload)
                    os.fsync(fd)
                finally:
                    os.close(fd)
                if os.path.lexists(path):
                    fd = require_secure(path, empty=False)
                    os.close(fd)
                os.rename(tmp, path)
                fsync_dir(parent)
            elif cmd == "audit":
                repo = args[0]
                specs = ["scripts", "services", "db", "modules", "handlers", "storage", ":(top,glob)*.py"]
                for extra in ([], ["--ignored"]):
                    out = subprocess.check_output(["/usr/bin/git", "-C", repo, "ls-files", "-z", "--others", "--exclude-standard", *extra, "--", *specs])
                    for rel in out.split(b"\0"):
                        if rel.endswith((b".py", b".sh", b".bash")):
                            raise SystemExit("untracked or ignored production source can shadow the authorized release")
            elif cmd == "read-phase":
                path, schema, baseline, run_id, control = args
                fd = require_secure(path, empty=False)
                try:
                    data = dict(line.split("=", 1) for line in os.read(fd, 4096).decode("ascii").splitlines() if line)
                finally:
                    os.close(fd)
                if data.get("schema") != schema or data.get("baseline") != baseline or data.get("failed_run") != run_id or data.get("control_sha") != control or data.get("phase") not in {"S0", "S1", "S2"}:
                    raise SystemExit("phase authority is not bound to this recovery")
                print(data["phase"])
            else:
                raise SystemExit("helper command is invalid")
            PY
            )
            hp() { "$PY" -I -c "$HELPER" "$@"; }
            peer() { ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes "root@${PEER_HOST}" "$@"; }
            peer_hp() { peer "$PY -I -c $(printf %q "$HELPER") $(printf '%q ' "$@")"; }
            present() { [ -e "$1" ] || [ -L "$1" ]; }
            prove_absent() { if present "$1"; then echo "[orphan-maint-recover] unexpected path present: $1" >&2; exit 1; fi; }
            prove_release() {
              test "$(git -C "$1" rev-parse HEAD)" = "$REQUIRED_SHA"
              git -C "$1" diff --quiet "$REQUIRED_SHA" --
              git -C "$1" diff --cached --quiet "$REQUIRED_SHA" --
            }
            prove_artifacts() {
              local root="$1" item
              for item in $CONFLICTS $SYNCS; do
                if [ -e "$root/$item" ] || [ -L "$root/$item" ]; then
                  echo "[orphan-maint-recover] unexpected HA artifact present: $item" >&2
                  exit 1
                fi
              done
            }
            restore_s0() {
              rc=0
              hp empty "$PER" || rc=1
              peer_hp empty "$PER" || rc=1
              hp empty "$VOL" || rc=1
              peer_hp empty "$VOL" || rc=1
              hp probe "$R" 503 ready-maint || rc=1
              peer_hp probe "$R" 503 ready-maint || rc=1
            }
            fail_closed_cleanup() {
              trap - EXIT
              if [ "$RECOVERY_COMPLETE" = "true" ]; then
                exit 0
              fi
              echo "[orphan-maint-recover] fail-closed trap re-arming both marker pairs" >&2
              restore_s0
              if [ "$rc" -ne 0 ]; then
                echo "[orphan-maint-recover] fail-closed re-arm or readiness proof failed" >&2
              else
                echo "[orphan-maint-recover] both nodes remain direct readiness 503 solely maintenance" >&2
              fi
              exit 1
            }
            span_public() {
              local code="$1" mode="$2"
              local deadline=$(( $(date +%s) + DRAIN_SECONDS ))
              while :; do
                peer_hp probe "$R" 200 ready-ok
                hp probe "$R" "$code" "$mode"
                hp probe "$PUB" 200 ready-ok
                [ "$(date +%s)" -ge "$deadline" ] && break
                sleep 5
              done
            }
            prove_release "$REPO_DIR"
            test -f "$REPO_DIR/.env" && test ! -L "$REPO_DIR/.env"
            test "$(stat -c '%u:%g:%a' "$REPO_DIR/.env")" = "0:0:600"
            hp node "$REPO_DIR/.env" node01
            hp audit "$REPO_DIR"
            LOCAL_HMAC="$(hp hmac "$REPO_DIR/.env" "$REQUIRED_OLD_ID" "$REQUIRED_REDIRECT" "$REQUIRED_SHA")"
            hp process "$REPO_DIR/.env"
            prove_artifacts "$STATE"
            hp dropins
            peer "REPO_DIR='$REPO_DIR' REQUIRED_SHA='$REQUIRED_SHA' REQUIRED_OLD_ID='$REQUIRED_OLD_ID' REQUIRED_REDIRECT='$REQUIRED_REDIRECT' PY='$PY' STATE='$STATE' CONFLICTS='$CONFLICTS' SYNCS='$SYNCS' DROPINS='$DROPINS' QUEUES='$QUEUES' HELPER=$(printf %q "$HELPER") bash -s" <<'EOS'
            set -euo pipefail
            hp() { "$PY" -I -c "$HELPER" "$@"; }
            test "$(git -C "$REPO_DIR" rev-parse HEAD)" = "$REQUIRED_SHA"
            git -C "$REPO_DIR" diff --quiet "$REQUIRED_SHA" --
            git -C "$REPO_DIR" diff --cached --quiet "$REQUIRED_SHA" --
            test -f "$REPO_DIR/.env" && test ! -L "$REPO_DIR/.env"
            test "$(stat -c '%u:%g:%a' "$REPO_DIR/.env")" = "0:0:600"
            hp node "$REPO_DIR/.env" node02
            hp audit "$REPO_DIR"
            hp hmac "$REPO_DIR/.env" "$REQUIRED_OLD_ID" "$REQUIRED_REDIRECT" "$REQUIRED_SHA" >/dev/null
            hp process "$REPO_DIR/.env"
            for item in $CONFLICTS $SYNCS; do
              if [ -e "$STATE/$item" ] || [ -L "$STATE/$item" ]; then
                echo "[orphan-maint-recover] unexpected HA artifact present: $item" >&2
                exit 1
              fi
            done
            hp dropins
            EOS
            PEER_HMAC="$(peer_hp hmac "$REPO_DIR/.env" "$REQUIRED_OLD_ID" "$REQUIRED_REDIRECT" "$REQUIRED_SHA")"
            test "$LOCAL_HMAC" = "$PEER_HMAC"
            DRAIN_SECONDS="$(hp drain "$REPO_DIR/.env")"
            NOW_EPOCH="$(date +%s)"
            lv=0 lp=0 pv=0 pp=0
            present "$VOL" && lv=1
            present "$PER" && lp=1
            peer "test -e '$VOL' || test -L '$VOL'" && pv=1 || true
            peer "test -e '$PER' || test -L '$PER'" && pp=1 || true
            SAVED_PHASE=""
            if present "$PHASE_FILE"; then
              test -f "$PHASE_FILE" && test ! -L "$PHASE_FILE"
              test "$(stat -c '%u:%g:%a' "$PHASE_FILE")" = "0:0:600"
              SAVED_PHASE="$(hp read-phase "$PHASE_FILE" "$PHASE_SCHEMA" "$REQUIRED_SHA" "$REQUIRED_RUN_ID" "$REQUIRED_CONTROL_SHA")"
            fi
            if [ "$lv" -eq 1 ] && [ "$lp" -eq 1 ] && [ "$pv" -eq 1 ] && [ "$pp" -eq 1 ]; then
              if [ -z "$SAVED_PHASE" ]; then
                hp marker "$VOL" exact "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                hp marker "$PER" exact "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                peer_hp marker "$VOL" exact "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                peer_hp marker "$PER" exact "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
              else
                hp marker "$VOL" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                hp marker "$PER" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                peer_hp marker "$VOL" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
                peer_hp marker "$PER" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
              fi
              hp probe "$H" 200 live
              hp probe "$R" 503 ready-maint
              peer_hp probe "$H" 200 live
              peer_hp probe "$R" 503 ready-maint
              PHASE=S0
            elif [ "$lv" -eq 1 ] && [ "$lp" -eq 1 ] && [ "$pv" -eq 0 ] && [ "$pp" -eq 0 ]; then
              if [ "$SAVED_PHASE" != "S0" ] && [ "$SAVED_PHASE" != "S1" ]; then
                echo "[orphan-maint-recover] marker/phase combination is not an admitted recovery state" >&2
                exit 1
              fi
              hp marker "$VOL" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
              hp marker "$PER" drain "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"
              hp probe "$H" 200 live
              hp probe "$R" 503 ready-maint
              peer_hp probe "$H" 200 live
              peer_hp probe "$R" 200 ready-ok
              PHASE=S1
            elif [ "$lv" -eq 0 ] && [ "$lp" -eq 0 ] && [ "$pv" -eq 0 ] && [ "$pp" -eq 0 ]; then
              if [ "$SAVED_PHASE" != "S1" ] && [ "$SAVED_PHASE" != "S2" ]; then
                echo "[orphan-maint-recover] marker/phase combination is not an admitted recovery state" >&2
                exit 1
              fi
              prove_absent "$VOL"
              prove_absent "$PER"
              hp probe "$H" 200 live
              hp probe "$R" 200 ready-ok
              peer_hp probe "$H" 200 live
              peer_hp probe "$R" 200 ready-ok
              PHASE=S2
            else
              if [ "$SAVED_PHASE" != "S0" ] && [ "$SAVED_PHASE" != "S1" ] && [ "$SAVED_PHASE" != "S2" ]; then
                echo "[orphan-maint-recover] unbound split marker state is not an admitted recovery state" >&2
                exit 1
              fi
              if [ "$lv" -eq 1 ]; then hp marker "$VOL" recent "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"; fi
              if [ "$lp" -eq 1 ]; then hp marker "$PER" recent "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"; fi
              if [ "$pv" -eq 1 ]; then peer_hp marker "$VOL" recent "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"; fi
              if [ "$pp" -eq 1 ]; then peer_hp marker "$PER" recent "$FAILED_RUN_START" "$MARKER_PROVENANCE" "$DRAIN_SECONDS" "$NOW_EPOCH"; fi
              echo "[orphan-maint-recover] bound partial marker pair crash state; restoring S0" >&2
              trap fail_closed_cleanup EXIT
              restore_s0
              test "$rc" -eq 0
              hp write-phase "$PHASE_FILE" "$PHASE_SCHEMA" "$REQUIRED_SHA" "$REQUIRED_RUN_ID" "$REQUIRED_CONTROL_SHA" S0
              trap - EXIT
              exit 1
            fi
            hp write-phase "$PHASE_FILE" "$PHASE_SCHEMA" "$REQUIRED_SHA" "$REQUIRED_RUN_ID" "$REQUIRED_CONTROL_SHA" "$PHASE"
            trap fail_closed_cleanup EXIT
            if [ "$PHASE" = "S0" ]; then
              peer_hp unlink "$VOL"
              peer_hp unlink "$PER"
              PHASE=S1
              hp write-phase "$PHASE_FILE" "$PHASE_SCHEMA" "$REQUIRED_SHA" "$REQUIRED_RUN_ID" "$REQUIRED_CONTROL_SHA" "$PHASE"
            fi
            if [ "$PHASE" = "S1" ]; then
              span_public 503 ready-maint
              hp unlink "$VOL"
              hp unlink "$PER"
              PHASE=S2
              hp write-phase "$PHASE_FILE" "$PHASE_SCHEMA" "$REQUIRED_SHA" "$REQUIRED_RUN_ID" "$REQUIRED_CONTROL_SHA" "$PHASE"
            fi
            hp probe "$H" 200 live
            hp probe "$R" 200 ready-ok
            peer_hp probe "$H" 200 live
            peer_hp probe "$R" 200 ready-ok
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$REQUIRED_SHA"
            span_public 200 ready-ok
            trap - EXIT
            RECOVERY_COMPLETE=true
            echo "[orphan-maint-recover] outcome=recovered control_sha=$REQUIRED_CONTROL_SHA baseline=$REQUIRED_SHA failed_run_id=$REQUIRED_RUN_ID"
      - name: Emit sanitized recovery receipt
        env:
          CONTROL_SHA: ${{ github.sha }}
          BASELINE_SHA: a2ba8d63265504ded18b6d4bd70219628c4d8533
          FAILED_RUN_ID: "32527312818"
        run: |
          set -euo pipefail
          {
            echo "orphan_maintenance_recovery outcome=recovered"
            echo "control_sha=$CONTROL_SHA"
            echo "baseline=$BASELINE_SHA"
            echo "failed_run_id=$FAILED_RUN_ID"
          } | tee -a "$GITHUB_STEP_SUMMARY"
