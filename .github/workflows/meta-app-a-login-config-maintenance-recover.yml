# Bound recovery for run 32527312818: both nodes left in empty-marker
# maintenance after a script_stop/heredoc parse failure, old env unchanged.
# Cannot be reused for any other SHA or config ID.
name: Meta App A Login Config Maintenance Recover

on:
  workflow_dispatch:
    inputs:
      BASELINE_SHA:
        description: "Must equal a2ba8d63265504ded18b6d4bd70219628c4d8533"
        required: true
        type: string
      EXPECTED_OLD_CONFIG_ID:
        description: "Must equal 1369663304545819"
        required: true
        type: string
      CONFIRM:
        description: "Type RECOVER_APP_A_LOGIN_CONFIG_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533"
        required: true
        type: string

concurrency:
  group: meta-social-cutover
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recover:
    name: Recover App A login-config maintenance
    if: >
      github.ref == 'refs/heads/main' &&
      github.event.inputs.BASELINE_SHA == 'a2ba8d63265504ded18b6d4bd70219628c4d8533' &&
      github.event.inputs.EXPECTED_OLD_CONFIG_ID == '1369663304545819' &&
      github.event.inputs.CONFIRM == 'RECOVER_APP_A_LOGIN_CONFIG_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: meta-social-cutover
    steps:
      - name: Prove unchanged baseline then lift empty maintenance markers
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.inputs.BASELINE_SHA }}
          BASELINE_SHA: ${{ github.event.inputs.BASELINE_SHA }}
          EXPECTED_OLD_CONFIG_ID: ${{ github.event.inputs.EXPECTED_OLD_CONFIG_ID }}
          CONFIRM: ${{ github.event.inputs.CONFIRM }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: false
          command_timeout: 14m
          envs: EXPECTED_RELEASE_SHA,BASELINE_SHA,EXPECTED_OLD_CONFIG_ID,CONFIRM
          script: |
            set -euo pipefail
            REQUIRED_SHA=a2ba8d63265504ded18b6d4bd70219628c4d8533
            REQUIRED_CONFIG_ID=1369663304545819
            REQUIRED_CONFIRM=RECOVER_APP_A_LOGIN_CONFIG_MAINTENANCE_a2ba8d63265504ded18b6d4bd70219628c4d8533
            REQUIRED_REDIRECT=https://www.linasaibot.com/oauth/meta/callback
            test "$BASELINE_SHA" = "$REQUIRED_SHA"
            test "$EXPECTED_RELEASE_SHA" = "$REQUIRED_SHA"
            test "$EXPECTED_OLD_CONFIG_ID" = "$REQUIRED_CONFIG_ID"
            test "$CONFIRM" = "$REQUIRED_CONFIRM"
            test "$(id -u)" -eq 0 && test "$(id -g)" -eq 0
            exec 9>/run/lock/linasbot-meta-live.lock
            flock -x 9
            export LINAS_PRODUCTION_MUTATION_LOCK_FD=9
            REPO_DIR=/opt/linasbot
            PEER_HOST="${LINAS_HA_PEER_HOST:-10.106.0.4}"
            MAINTENANCE_FILE=/run/linasbot-maintenance
            META_HA_STATE_ROOT=/var/lib/linasbot/meta-ha
            PERSISTENT_MAINTENANCE_FILE="$META_HA_STATE_ROOT/maintenance"
            prove_clean_sha() {
              local repo="$1"
              local deployed
              deployed="$(git -C "$repo" rev-parse HEAD)"
              if [ "$deployed" != "$REQUIRED_SHA" ]; then
                echo "[meta-login-recover] node SHA is not the failed-run baseline" >&2
                exit 1
              fi
              if ! git -C "$repo" diff --quiet "$REQUIRED_SHA" -- || \
                 ! git -C "$repo" diff --cached --quiet "$REQUIRED_SHA" --; then
                echo "[meta-login-recover] tracked files differ from baseline SHA" >&2
                exit 1
              fi
            }
            prove_empty_marker() {
              local marker="$1"
              test -f "$marker" && test ! -L "$marker"
              test "$(stat -c '%u:%g:%a' "$marker")" = "0:0:600"
              test ! -s "$marker"
            }
            prove_absent() {
              local path="$1"
              if [ -e "$path" ] || [ -L "$path" ]; then
                echo "[meta-login-recover] unexpected HA artifact present: $path" >&2
                exit 1
              fi
            }
            fsync_unlink() {
              local path="$1"
              "$REPO_DIR/venv/bin/python" -I -c 'import os, sys; path = sys.argv[1]; os.unlink(path); fd = os.open(os.path.dirname(path), os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)); os.fsync(fd); os.close(fd)' "$path"
            }
            prove_clean_sha "$REPO_DIR"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test \"\$(git -C '$REPO_DIR' rev-parse HEAD)\" = '$REQUIRED_SHA' && git -C '$REPO_DIR' diff --quiet '$REQUIRED_SHA' -- && git -C '$REPO_DIR' diff --cached --quiet '$REQUIRED_SHA' --"
            prove_empty_marker "$MAINTENANCE_FILE"
            prove_empty_marker "$PERSISTENT_MAINTENANCE_FILE"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test -f '$MAINTENANCE_FILE' && test ! -L '$MAINTENANCE_FILE' && test \"\$(stat -c '%u:%g:%a' '$MAINTENANCE_FILE')\" = '0:0:600' && test ! -s '$MAINTENANCE_FILE' && test -f '$PERSISTENT_MAINTENANCE_FILE' && test ! -L '$PERSISTENT_MAINTENANCE_FILE' && test \"\$(stat -c '%u:%g:%a' '$PERSISTENT_MAINTENANCE_FILE')\" = '0:0:600' && test ! -s '$PERSISTENT_MAINTENANCE_FILE'"
            for artifact in transaction.json env.before workers.before.json prestage.authority.json; do
              prove_absent "$META_HA_STATE_ROOT/$artifact"
              ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
                "root@${PEER_HOST}" \
                "test ! -e '$META_HA_STATE_ROOT/$artifact' && test ! -L '$META_HA_STATE_ROOT/$artifact'"
            done
            RECOVERY_OUTPUT="$("$REPO_DIR/venv/bin/python" -I "$REPO_DIR/scripts/ha/sync_meta_env_to_peer.py" \
              --expected-sha "$REQUIRED_SHA" --maintenance-active --recover-only)"
            printf '%s\n' "$RECOVERY_OUTPUT"
            printf '%s\n' "$RECOVERY_OUTPUT" | grep -Fqx "[meta-ha-env] recovery_required=false"
            CONFIG_PROOF="$("$REPO_DIR/venv/bin/python" -I -c 'import hashlib, hmac, json, sys; from dotenv import dotenv_values; values = dotenv_values(sys.argv[1], interpolate=False); config = str(values.get("META_APP_A_FACEBOOK_LOGIN_CONFIG_ID") or ""); redirect = str(values.get("META_OAUTH_REDIRECT_URI") or ""); sys.exit("old login config or redirect changed") if config != sys.argv[2] or redirect != sys.argv[3] else None; meta = {k: v for k, v in values.items() if k and k.startswith("META_") and k != "META_DELETION_NODE_ID" and v is not None}; print(hmac.new(sys.argv[4].encode("ascii"), json.dumps(meta, separators=(",", ":"), sort_keys=True).encode("utf-8"), hashlib.sha256).hexdigest())' "$REPO_DIR/.env" "$REQUIRED_CONFIG_ID" "$REQUIRED_REDIRECT" "$REQUIRED_SHA")"
            PEER_UNLINK='import os, sys; path = sys.argv[1]; os.unlink(path); fd = os.open(os.path.dirname(path), os.O_RDONLY | getattr(os, "O_DIRECTORY", 0)); os.fsync(fd); os.close(fd)'
            PEER_PROOF="$(ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "REQUIRED_SHA='$REQUIRED_SHA' REQUIRED_CONFIG_ID='$REQUIRED_CONFIG_ID' REQUIRED_REDIRECT='$REQUIRED_REDIRECT' ENV_PATH='$REPO_DIR/.env' '$REPO_DIR/venv/bin/python' -I -c 'import hashlib, hmac, json, os, sys; from dotenv import dotenv_values; values = dotenv_values(os.environ[\"ENV_PATH\"], interpolate=False); config = str(values.get(\"META_APP_A_FACEBOOK_LOGIN_CONFIG_ID\") or \"\"); redirect = str(values.get(\"META_OAUTH_REDIRECT_URI\") or \"\"); sys.exit(\"peer login config or redirect changed\") if config != os.environ[\"REQUIRED_CONFIG_ID\"] or redirect != os.environ[\"REQUIRED_REDIRECT\"] else None; meta = {k: v for k, v in values.items() if k and k.startswith(\"META_\") and k != \"META_DELETION_NODE_ID\" and v is not None}; print(hmac.new(os.environ[\"REQUIRED_SHA\"].encode(\"ascii\"), json.dumps(meta, separators=(\",\", \":\"), sort_keys=True).encode(\"utf-8\"), hashlib.sha256).hexdigest())'")"
            test "$CONFIG_PROOF" = "$PEER_PROOF"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "'$REPO_DIR/venv/bin/python' -I -c '$PEER_UNLINK' '$MAINTENANCE_FILE'"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "'$REPO_DIR/venv/bin/python' -I -c '$PEER_UNLINK' '$PERSISTENT_MAINTENANCE_FILE'"
            fsync_unlink "$MAINTENANCE_FILE"
            fsync_unlink "$PERSISTENT_MAINTENANCE_FILE"
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:8003/api/ready)" = "200"
            ssh -o BatchMode=yes -o ConnectTimeout=8 -o StrictHostKeyChecking=yes \
              "root@${PEER_HOST}" \
              "test \"\$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8003/api/ready)\" = 200"
            bash "$REPO_DIR/scripts/ha/verify_meta_release_ha.sh" "$REQUIRED_SHA"
            test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 \
              https://www.linasaibot.com/api/ready)" = "200"
