services:
  # Single shared Redis for durable Phase 2 queues (reuse; do not add a second instance).
  redis:
    image: redis:7-alpine
    container_name: linas_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - linas_redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - linas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Backend (Python Bot + API)
  # Durable app state: Firestore + LINASBOT_DATA_ROOT files; queues: Redis when REDIS_URL set.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: linas_backend
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - LINASBOT_DATA_ROOT=/opt/linasbot_data
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - LINAS_REQUIRE_REDIS=${LINAS_REQUIRE_REDIS:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - DIALOG360_API_KEY=${DIALOG360_API_KEY}
      - DIALOG360_SANDBOX=${DIALOG360_SANDBOX}
      - DIALOG360_PHONE_NUMBER=${DIALOG360_PHONE_NUMBER}
      - WHATSAPP_TO=${WHATSAPP_TO}
      - TRAINER_WHATSAPP_NUMBER=${TRAINER_WHATSAPP_NUMBER}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - LINASLASER_API_BASE_URL=${LINASLASER_API_BASE_URL}
      - LINASLASER_API_TOKEN=${LINASLASER_API_TOKEN}
      - MONTYMOBILE_API_KEY=${MONTYMOBILE_API_KEY}
      - DASHBOARD_AUTH_SECRET=${DASHBOARD_AUTH_SECRET}
    volumes:
      - ./:/app
      - ./data:/app/data
      - linasbot_data:/opt/linasbot_data
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - linas_network

  # Dashboard (React Frontend)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: linas_dashboard
    # Local compose: same-origin relative /api via browser when empty, or override.
    # Never bake the retired tradershubs hostname (stale). Prefer linasaibot.com
    # only when explicitly targeting that host from a remote browser.
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8003/api}
      - REACT_APP_WS_URL=${REACT_APP_WS_URL:-ws://localhost:8003/ws}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - linas_network

volumes:
  linasbot_data:
  linas_redis_data:

networks:
  linas_network:
    driver: bridge
