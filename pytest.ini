[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:Using `httpx` with `starlette.testclient`:starlette.exceptions.StarletteDeprecationWarning
    ignore:Couldn't find ffmpeg or avconv:RuntimeWarning
markers =
    integration: requires external services or live credentials
    manual: interactive/manual scripts not for CI
