services:
  # Redis/Postgres compose services removed — unused by application code.
  # Durable state: Firestore + LINASBOT_DATA_ROOT.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: linas_backend_prod
    environment:
      - LINASBOT_DATA_ROOT=/opt/linasbot_data
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WHATSAPP_API_TOKEN=${WHATSAPP_API_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - DIALOG360_API_KEY=${DIALOG360_API_KEY}
      - DIALOG360_SANDBOX=${DIALOG360_SANDBOX}
      - DIALOG360_PHONE_NUMBER=${DIALOG360_PHONE_NUMBER}
      - WHATSAPP_TO=${WHATSAPP_TO}
      - TRAINER_WHATSAPP_NUMBER=${TRAINER_WHATSAPP_NUMBER}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - LINASLASER_API_BASE_URL=${LINASLASER_API_BASE_URL}
      - LINASLASER_API_TOKEN=${LINASLASER_API_TOKEN}
      - MONTYMOBILE_API_KEY=${MONTYMOBILE_API_KEY}
      - DASHBOARD_AUTH_SECRET=${DASHBOARD_AUTH_SECRET}
    volumes:
      - linasbot_data:/opt/linasbot_data
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - linas_network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
      # Leave empty so the browser uses same-origin /api/ (nginx → backend). Never default to
      # localhost here — that gets baked into JS and breaks https://linasaibot.com (calls user's PC).
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:-}
    container_name: linas_dashboard_prod
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - linas_network

volumes:
  linasbot_data:

networks:
  linas_network:
    driver: bridge
