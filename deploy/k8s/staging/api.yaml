apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linas-api
  template:
    metadata:
      labels:
        app: linas-api
    spec:
      containers:
        - name: api
          image: ghcr.io/mahmoudalzoughbi/linasbot-server:staging
          args: ["api"]
          ports:
            - containerPort: 8003
          env:
            - name: LINAS_CONFIG_SOURCE
              value: env
            - name: LINAS_LOG_FORMAT
              value: json
            - name: LINAS_HEALTH_STRICT
              value: "1"
            - name: LINAS_FLAG_QUEUE_BACKEND
              value: pg
            - name: LINAS_REQUIRE_SHARED_STORES
              value: "1"
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8003
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8003
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: linas-api
  ports:
    - port: 80
      targetPort: 8003
