apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linas-worker-background
  template:
    metadata:
      labels:
        app: linas-worker-background
    spec:
      containers:
        - name: worker
          image: ghcr.io/mahmoudalzoughbi/linasbot-server:staging
          args: ["worker", "--queue", "maintenance"]
          env:
            - name: LINAS_CONFIG_SOURCE
              value: env
            - name: LINAS_FLAG_QUEUE_BACKEND
              value: pg
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
