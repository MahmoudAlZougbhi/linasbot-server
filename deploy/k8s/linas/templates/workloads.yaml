apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-interactive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linas-worker-interactive
  template:
    metadata:
      labels:
        app: linas-worker-interactive
    spec:
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          args: ["worker", "--queue", "interactive"]
          envFrom:
            - secretRef:
                name: {{ .Values.envSecret }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
