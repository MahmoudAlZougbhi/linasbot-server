# Loaded from /etc/nginx/conf.d so it is available to all Lina's Bot vhosts.
# Deliberately omit $request, $request_uri, $args, $query_string, referrer, and
# headers: each can persist OAuth codes, webhook tokens, or signed requests.
log_format linasbot_safe '$remote_addr [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';
