# Nginx config for linasaibot.com (host-level)
# Copy to /etc/nginx/sites-available/linasaibot and symlink to sites-enabled
# For SSL: run certbot after first deploy, or if certs exist at /etc/letsencrypt/live/linasaibot.com/ this will use them

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name linasaibot.com www.linasaibot.com;
    access_log /var/log/nginx/linasaibot.access.log linasbot_safe;
    # Drop the query on an accidental HTTP request so credentials are never
    # reflected into a redirect Location header.
    return 301 https://$host$uri;
}

server {
    listen 443 ssl;
    server_name linasaibot.com www.linasaibot.com;
    root /opt/linasbot/dashboard/build;
    index index.html;
    access_log /var/log/nginx/linasaibot.access.log linasbot_safe;

    # SSL (certbot paths - run: certbot certonly -d linasaibot.com -d www.linasaibot.com)
    ssl_certificate /etc/letsencrypt/live/linasaibot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linasaibot.com/privkey.pem;

    # Owner Copilot SSE — no buffering, long read timeout for tool rounds + Sol reply.
    location ^~ /api/owner-ai/conversations {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests to backend (auth, live-chat, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WhatsApp + Meta Messenger/Instagram webhooks (GET verify + POST events).
    # ^~ prevents /webhook/* from falling through to the SPA try_files.
    location ^~ /webhook {
        # Defense in depth: webhook GET queries can carry verification tokens.
        access_log off;
        # Nginx error records can include the full request line at ordinary
        # severities. Keep this credential-bearing endpoint at critical-only.
        error_log /var/log/nginx/linasaibot-sensitive.error.log crit;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Meta compliance pages and authenticated data-deletion callback.
    # Exact matches keep the SPA from serving dashboard HTML at these URLs.
    location = /privacy-policy {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /terms {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /data-deletion {
        # Meta signed_request values are credentials and must never be logged.
        access_log off;
        error_log /var/log/nginx/linasaibot-sensitive.error.log crit;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public Meta data-deletion status pages (must reach FastAPI, not SPA).
    location ^~ /data-deletion/status/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Meta Business Login OAuth callback (must reach FastAPI, not the SPA).
    location ^~ /oauth/ {
        access_log off;
        error_log /var/log/nginx/linasaibot-sensitive.error.log crit;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Meta App B deauthorization callback.
    location = /meta/deauthorize {
        access_log off;
        error_log /var/log/nginx/linasaibot-sensitive.error.log crit;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APK / app downloads are served by the backend, not the React SPA.
    location /downloads/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing + static files (public landing + authenticated dashboard)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
