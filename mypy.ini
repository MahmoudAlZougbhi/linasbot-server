[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
check_untyped_defs = True
ignore_missing_imports = True
follow_imports = skip
explicit_package_bases = True

# Expand coverage gradually; these modules are the Wave 1/4 security/reliability core.
[mypy-services.durable_event_claim]
disallow_untyped_defs = True

[mypy-services.ssrf_guard]
disallow_untyped_defs = True

[mypy-services.safe_path]
disallow_untyped_defs = True

[mypy-modules.api_security]
disallow_untyped_defs = True
